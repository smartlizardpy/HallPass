<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Core vs. Swarm: BULLETPROOF</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        :root {
            --p1-color: #00f0ff;
            --p2-color: #ff0055;
            --bg-color: #050508;
            --ui-font: 'Orbitron', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            overflow: hidden;
            font-family: var(--ui-font);
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        #crt-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%),
                        linear-gradient(90deg, rgba(255,0,0,0.03), rgba(0,255,0,0.01), rgba(0,0,255,0.03));
            background-size: 100% 3px, 4px 100%;
            mix-blend-mode: overlay;
        }

        #fx-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 9;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
            transition: box-shadow 0.2s;
        }

        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 20;
            display: flex; flex-direction: column; justify-content: space-between;
        }

        .hud-zone {
            width: 100%; height: 15%;
            display: flex; align-items: center; justify-content: center;
            text-transform: uppercase; letter-spacing: 2px;
            font-size: 0.9rem; font-weight: bold;
            text-shadow: 0 0 8px currentColor;
            opacity: 0.8;
            pointer-events: none;
        }

        .top-hud { color: var(--p2-color); background: linear-gradient(to bottom, rgba(255,0,85,0.1), transparent); }
        .bot-hud { color: var(--p1-color); background: linear-gradient(to top, rgba(0,240,255,0.1), transparent); }

        #center-hud {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: auto;
            z-index: 25;
            cursor: pointer;
        }

        #timer {
            font-size: 5rem; color: rgba(255,255,255,0.2);
            transition: all 0.2s; font-weight: 900;
        }
        #timer:hover { color: rgba(255,255,255,0.8); transform: scale(1.1); text-shadow: 0 0 20px white; }

        #combo-counter {
            font-size: 1.5rem; color: #ffd700; opacity: 0;
            transition: opacity 0.3s; margin-top: -10px;
            text-shadow: 0 0 10px #ffd700;
        }

        .modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 8, 0.95);
            backdrop-filter: blur(10px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 50;
            transition: opacity 0.3s;
        }

        h1 {
            font-size: 3.5rem; color: white; margin: 0;
            text-shadow: 4px 4px 0px var(--p2-color), -4px -4px 0px var(--p1-color);
            letter-spacing: 5px; text-transform: uppercase;
            animation: glitch 2s infinite alternate;
            text-align: center;
        }

        @keyframes glitch {
            0% { text-shadow: 4px 4px 0px var(--p2-color), -4px -4px 0px var(--p1-color); }
            100% { text-shadow: -2px 2px 0px var(--p2-color), 2px -2px 0px var(--p1-color); }
        }

        .btn {
            margin-top: 30px; padding: 20px 60px;
            background: rgba(0, 240, 255, 0.1); 
            border: 2px solid var(--p1-color);
            color: var(--p1-color); font-family: var(--ui-font);
            font-size: 1.5rem; font-weight: bold; cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 15px var(--p1-color), inset 0 0 10px var(--p1-color);
            transition: all 0.2s;
            pointer-events: auto;
            position: relative;
            z-index: 100; /* Ensure button is on top */
        }
        .btn:hover { background: var(--p1-color); color: black; box-shadow: 0 0 30px var(--p1-color); }
        .btn:active { transform: scale(0.95); }

        .stat-row { display: flex; gap: 20px; margin-top: 20px; color: #aaa; font-size: 1.2rem; }
        .stat-val { color: white; font-weight: bold; }

        #controls-hint {
            display: flex; justify-content: space-around; width: 80%; margin-top: 40px;
            color: white; opacity: 0.7; font-size: 0.9rem; text-align: center;
        }

        .hidden { display: none !important; }
        #gameCanvas { width: 100vw; height: 100vh; display: block; }

        /* Crash Reporter UI */
        #error-log {
            position: absolute; bottom: 0; left: 0; width: 100%;
            background: rgba(255, 0, 0, 0.8); color: white;
            font-family: monospace; padding: 10px; font-size: 12px;
            z-index: 1000; display: none;
        }
    </style>
</head>
<body>

    <div id="error-log"></div>
    <div id="crt-layer"></div>
    <div id="fx-layer"></div>

    <div id="ui-layer">
        <div class="hud-zone top-hud">P2: Tap edges for Speed / Center for Tank</div>
        <div id="center-hud" onclick="togglePause()">
            <div id="timer">90</div>
            <div id="combo-counter">x1 COMBO</div>
        </div>
        <div class="hud-zone bot-hud">P1: Tap Sides to Shield / Catch Green Orbs</div>
    </div>

    <!-- Start Menu -->
    <div id="start-menu" class="modal">
        <h1>CORE vs SWARM</h1>
        <div style="color:var(--p1-color); letter-spacing:5px; margin-bottom:20px;">STABLE V3</div>
        <div id="controls-hint">
            <div>▲ RED<br>Spawn Swarm</div>
            <div>▼ BLUE<br>Rotate Shield</div>
        </div>
        <button class="btn" onclick="startGame()">INITIALIZE</button>
    </div>

    <!-- Game Over -->
    <div id="game-over" class="modal hidden">
        <h1 id="winner-text">GAME OVER</h1>
        <div id="winner-sub" style="color:#fff; margin-bottom:20px; font-size:1.2rem;">REASON</div>
        <div class="stat-row">
            <div>Enemies: <span id="stat-enemies" class="stat-val">0</span></div>
            <div>Combo Max: <span id="stat-combo" class="stat-val">0</span></div>
        </div>
        <button class="btn" onclick="resetGame()">REBOOT</button>
    </div>

    <!-- Pause -->
    <div id="pause-menu" class="modal hidden" style="background:rgba(0,0,0,0.6)">
        <h1 style="font-size:2rem; animation:none;">SYSTEM PAUSED</h1>
        <button class="btn" onclick="togglePause()">RESUME</button>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
    // --- Error Handling ---
    window.onerror = function(msg, source, lineno, colno, error) {
        const el = document.getElementById('error-log');
        el.style.display = 'block';
        el.innerHTML += `ERROR: ${msg} <br> (Line: ${lineno}) <br>`;
        return false;
    };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    const ui = {
        timer: document.getElementById('timer'),
        combo: document.getElementById('combo-counter'),
        fx: document.getElementById('fx-layer'),
        start: document.getElementById('start-menu'),
        over: document.getElementById('game-over'),
        pause: document.getElementById('pause-menu'),
        winnerText: document.getElementById('winner-text'),
        winnerSub: document.getElementById('winner-sub'),
        statEnemies: document.getElementById('stat-enemies'),
        statCombo: document.getElementById('stat-combo')
    };

    // --- Audio System ---
    const Audio = {
        ctx: null,
        isPlaying: false,
        nextNoteTime: 0,
        beatCount: 0,
        initialized: false,
        
        init: function() {
            if (this.initialized) return;
            try {
                window.AudioContext = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioContext();
                this.isPlaying = true;
                this.initialized = true;
                this.nextNoteTime = this.ctx.currentTime + 0.1; // Sync to now
                this.scheduleNote();
            } catch (e) {
                console.log("Audio disabled or failed.");
            }
        },

        resume: function() {
            if (this.ctx && this.ctx.state === 'suspended') {
                this.ctx.resume().catch(e => console.log(e));
            }
        },

        scheduleNote: function() {
            if (!this.isPlaying || !this.ctx) return;
            const secondsPerBeat = 0.15; 
            const now = this.ctx.currentTime;
            
            // Safety break to prevent infinite loops if sync is lost
            let loopGuard = 0;
            while (this.nextNoteTime < now + 0.1 && loopGuard < 100) {
                this.playBeat(this.nextNoteTime, this.beatCount);
                this.nextNoteTime += secondsPerBeat;
                this.beatCount++;
                loopGuard++;
            }
            if (loopGuard >= 100) this.nextNoteTime = now + 0.1; // Reset if drifting

            requestAnimationFrame(this.scheduleNote.bind(this));
        },

        playBeat: function(time, beat) {
            if (!this.ctx) return;
            try {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                
                const notes = [65.41, 65.41, 77.78, 87.31]; 
                const freq = notes[Math.floor(beat / 4) % 4];
                
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(freq, time);
                gain.gain.setValueAtTime(0.08, time);
                gain.gain.exponentialRampToValueAtTime(0.001, time + 0.12);
                osc.start(time);
                osc.stop(time + 0.15);

                if (beat % 8 === 0) {
                    const kOsc = this.ctx.createOscillator();
                    const kGain = this.ctx.createGain();
                    kOsc.connect(kGain);
                    kGain.connect(this.ctx.destination);
                    kOsc.frequency.setValueAtTime(150, time);
                    kOsc.frequency.exponentialRampToValueAtTime(0.01, time + 0.5);
                    kGain.gain.setValueAtTime(0.4, time);
                    kGain.gain.exponentialRampToValueAtTime(0.001, time + 0.5);
                    kOsc.start(time);
                    kOsc.stop(time + 0.5);
                }
            } catch(e) {}
        },

        sfx: function(type) {
            if (!this.ctx) return;
            try {
                const t = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);

                if (type === 'spawn') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(600, t);
                    osc.frequency.linearRampToValueAtTime(200, t + 0.1);
                    gain.gain.setValueAtTime(0.05, t);
                    gain.gain.linearRampToValueAtTime(0, t + 0.1);
                    osc.start(t); osc.stop(t+0.1);
                } else if (type === 'hit') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(100, t);
                    osc.frequency.exponentialRampToValueAtTime(10, t + 0.2);
                    gain.gain.setValueAtTime(0.2, t);
                    gain.gain.linearRampToValueAtTime(0, t + 0.2);
                    osc.start(t); osc.stop(t+0.2);
                } else if (type === 'block') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(300, t);
                    osc.frequency.linearRampToValueAtTime(800, t + 0.05);
                    gain.gain.setValueAtTime(0.1, t);
                    gain.gain.linearRampToValueAtTime(0, t + 0.1);
                    osc.start(t); osc.stop(t+0.1);
                } else if (type === 'powerup') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, t);
                    osc.frequency.linearRampToValueAtTime(1200, t + 0.2);
                    gain.gain.setValueAtTime(0.1, t);
                    gain.gain.linearRampToValueAtTime(0, t + 0.2);
                    osc.start(t); osc.stop(t+0.2);
                }
            } catch(e) {}
        }
    };

    let width, height, cx, cy;
    let gameLoopId = null; // Store ID to cancel
    let state = {
        running: false,
        paused: false,
        frames: 0,
        time: 90,
        score: 0,
        combo: 0,
        maxCombo: 0,
        enemiesSpawned: 0,
        p2Energy: 100,
        coreHealth: 100,
        shake: 0,
        slowMo: 1.0,
        difficulty: 1.0
    };

    const ENTITY = {
        p1: { angle: 0, radius: 80, arc: Math.PI/1.3, dir: 0 },
        enemies: [],
        particles: [],
        texts: [],
        powerups: [],
        ripples: [],
        gridOffset: 0
    };

    const CONF = {
        colors: { p1: '#00f0ff', p2: '#ff0055', power: '#00ff66' },
        spawnCost: 20,
        recharge: 0.6
    };

    const touches = new Map();
    
    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        cx = width / 2;
        cy = height / 2;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- Input Handling ---
    function updateP1Direction() {
        let left = false, right = false;
        for (let d of touches.values()) {
            if (d === -1) left = true;
            if (d === 1) right = true;
        }
        ENTITY.p1.dir = (left && right) ? 0 : (left ? -1 : (right ? 1 : 0));
    }

    const handleInput = (x, y, id, type) => {
        if (!state.running || state.paused) return;

        if (type === 'end') {
            touches.delete(id);
            updateP1Direction();
            return;
        }

        if (type === 'start') {
            if (y < height * 0.4) {
                spawnEnemy(x, y);
                addRipple(x, y, CONF.colors.p2);
            }
            else if (y > height * 0.6) {
                touches.set(id, x < cx ? -1 : 1);
                updateP1Direction();
                addRipple(x, y, CONF.colors.p1);
            }
        }
    };

    // Global Listeners
    window.addEventListener('touchstart', e => {
        if(!e.target.closest('button')) e.preventDefault();
        for(let t of e.changedTouches) handleInput(t.clientX, t.clientY, t.identifier, 'start');
    }, {passive:false});
    
    window.addEventListener('touchend', e => {
        if(!e.target.closest('button')) e.preventDefault();
        for(let t of e.changedTouches) handleInput(t.clientX, t.clientY, t.identifier, 'end');
    }, {passive:false});

    window.addEventListener('touchcancel', e => {
        for(let t of e.changedTouches) handleInput(0, 0, t.identifier, 'end');
    });
    
    window.addEventListener('mousedown', e => {
        if(!e.target.closest('button')) handleInput(e.clientX, e.clientY, 'mouse', 'start');
    });
    
    window.addEventListener('mouseup', e => {
        if(!e.target.closest('button')) handleInput(e.clientX, e.clientY, 'mouse', 'end');
    });

    function startGame() {
        // Prevent double init
        if (gameLoopId) cancelAnimationFrame(gameLoopId);
        
        Audio.init();
        setTimeout(() => Audio.resume(), 50);
        
        resetVars();
        state.running = true;
        
        ui.start.classList.add('hidden');
        ui.over.classList.add('hidden');
        
        // Start loop
        loop(); 
    }

    function togglePause() {
        if (!state.running) return;
        state.paused = !state.paused;
        if (state.paused) {
            ui.pause.classList.remove('hidden');
        } else {
            ui.pause.classList.add('hidden');
            loop(); // Resume loop
        }
    }

    function resetVars() {
        state = { ...state, running: true, paused: false, time: 90, score: 0, combo: 0, coreHealth: 100, p2Energy: 100, enemiesSpawned: 0 };
        ENTITY.enemies = [];
        ENTITY.particles = [];
        ENTITY.powerups = [];
        ENTITY.texts = [];
        ENTITY.ripples = [];
        ENTITY.p1.angle = 0;
        ENTITY.p1.dir = 0;
        touches.clear();
        ui.timer.innerText = 90;
        ui.combo.style.opacity = 0;
        ui.fx.style.boxShadow = 'inset 0 0 100px rgba(0,0,0,0.9)';
    }

    function spawnEnemy(tx, ty) {
        if (state.p2Energy < CONF.spawnCost) return;
        state.p2Energy -= CONF.spawnCost;
        state.enemiesSpawned++;
        Audio.sfx('spawn');

        const angle = Math.atan2(ty - cy, tx - cx);
        const distFromCenter = Math.abs(tx - cx);
        
        let type = 'std';
        let speed = 2.5;
        let size = 12;
        let hp = 1;
        let color = CONF.colors.p2;

        if (distFromCenter < width * 0.15) {
            type = 'tank';
            speed = 1.2;
            size = 18;
            hp = 3; 
            color = '#ff4400';
        } else if (distFromCenter > width * 0.35) {
            type = 'dart';
            speed = 4.5;
            size = 8;
            color = '#ff0099';
        }

        speed *= state.difficulty;

        ENTITY.enemies.push({
            x: cx + Math.cos(angle) * (Math.max(width, height) * 0.7),
            y: cy + Math.sin(angle) * (Math.max(width, height) * 0.7),
            angle: angle,
            type, speed, size, hp, color,
            spin: (Math.random()-0.5)*0.2,
            rot: 0
        });
    }

    function spawnPowerup() {
        const angle = Math.random() * Math.PI * 2;
        ENTITY.powerups.push({
            x: cx + Math.cos(angle) * width * 0.8,
            y: cy + Math.sin(angle) * width * 0.8,
            vx: -Math.cos(angle) * 1.5,
            vy: -Math.sin(angle) * 1.5,
            angle: angle,
            life: 1.0
        });
    }

    function addFloatText(txt, x, y, color) {
        ENTITY.texts.push({ txt, x, y, color, life: 1.0, dy: -2 });
    }

    function addRipple(x, y, color) {
        ENTITY.ripples.push({ x, y, r: 10, alpha: 1.0, color });
    }

    function createExplosion(x, y, color, count=10) {
        for(let i=0; i<count; i++) {
            ENTITY.particles.push({
                x, y, 
                vx: (Math.random()-0.5)*8, 
                vy: (Math.random()-0.5)*8,
                life: 1.0, 
                color, 
                size: Math.random()*3+1
            });
        }
    }

    function update() {
        state.frames++;
        state.slowMo += (1.0 - state.slowMo) * 0.05;
        state.difficulty = 1.0 + (90 - state.time) * 0.02;

        if (state.frames % 60 === 0) {
            state.time--;
            ui.timer.innerText = state.time;
            if (state.time <= 0) gameOver("DEFENDER WINS", "TIME LIMIT REACHED");
            if (state.time % 10 === 0 && Math.random() > 0.3) spawnPowerup();
        }

        ENTITY.p1.angle += ENTITY.p1.dir * 0.12 * state.slowMo;

        if (state.p2Energy < 100) state.p2Energy += CONF.recharge;

        state.shake *= 0.9;
        if (state.shake < 0.5) state.shake = 0;

        ENTITY.gridOffset = (ENTITY.gridOffset + 1 * state.slowMo) % 40;

        for (let i = ENTITY.enemies.length - 1; i >= 0; i--) {
            let e = ENTITY.enemies[i];
            
            e.x -= Math.cos(e.angle) * e.speed * state.slowMo;
            e.y -= Math.sin(e.angle) * e.speed * state.slowMo;
            e.rot += e.spin;

            const dx = e.x - cx;
            const dy = e.y - cy;
            const dist = Math.sqrt(dx*dx + dy*dy);
            const ang = Math.atan2(dy, dx);

            if (state.frames % 3 === 0) {
                ENTITY.particles.push({
                    x: e.x, y: e.y, vx:0, vy:0, life:0.4, color: e.color, size: 2
                });
            }

            // Shield Collision
            let hitShield = false;
            let normE = (ang + Math.PI*2)%(Math.PI*2);
            let normS = (ENTITY.p1.angle + Math.PI*2)%(Math.PI*2);
            let diff = Math.abs(normE - normS);
            if (diff > Math.PI) diff = 2*Math.PI - diff;

            if (dist < ENTITY.p1.radius + e.size && dist > ENTITY.p1.radius - 5) {
                if (diff < ENTITY.p1.arc / 2) {
                    e.hp--;
                    createExplosion(e.x, e.y, CONF.colors.p1, 5);
                    Audio.sfx('block');
                    state.shake = 3;
                    
                    e.x += Math.cos(e.angle) * 20;
                    e.y += Math.sin(e.angle) * 20;

                    if (e.hp <= 0) {
                        createExplosion(e.x, e.y, CONF.colors.p1, 15);
                        state.combo++;
                        state.maxCombo = Math.max(state.combo, state.maxCombo);
                        ui.combo.innerText = `x${state.combo} COMBO`;
                        ui.combo.style.opacity = 1;
                        addFloatText("BLOCK", e.x, e.y, CONF.colors.p1);
                        ENTITY.enemies.splice(i, 1);
                    } else {
                         addFloatText("TINK", e.x, e.y, '#fff');
                    }
                    continue;
                }
            }

            // Core Collision
            if (dist < 30) {
                let dmg = e.type === 'tank' ? 25 : 10;
                state.coreHealth -= dmg;
                state.combo = 0;
                ui.combo.style.opacity = 0;
                
                state.shake = 20;
                state.slowMo = 0.2;
                createExplosion(e.x, e.y, CONF.colors.p2, 20);
                Audio.sfx('hit');
                addFloatText(`-${dmg}`, e.x, e.y, '#fff');

                ui.fx.style.boxShadow = `inset 0 0 100px rgba(255,0,0,0.8)`;
                setTimeout(() => ui.fx.style.boxShadow = 'inset 0 0 100px rgba(0,0,0,0.9)', 200);

                ENTITY.enemies.splice(i, 1);

                if (state.coreHealth <= 0) gameOver("SWARM WINS", "CORE DESTROYED");
            }
        }

        // Powerups
        for (let i = ENTITY.powerups.length - 1; i >= 0; i--) {
            let p = ENTITY.powerups[i];
            p.x += p.vx * state.slowMo;
            p.y += p.vy * state.slowMo;
            
            const dx = p.x - cx;
            const dy = p.y - cy;
            const dist = Math.sqrt(dx*dx + dy*dy);
            
            if (dist < ENTITY.p1.radius + 10 && dist > ENTITY.p1.radius - 10) {
                let ang = Math.atan2(dy, dx);
                let normP = (ang + Math.PI*2)%(Math.PI*2);
                let normS = (ENTITY.p1.angle + Math.PI*2)%(Math.PI*2);
                let diff = Math.abs(normP - normS);
                if (diff > Math.PI) diff = 2*Math.PI - diff;

                if (diff < ENTITY.p1.arc / 2) {
                    state.coreHealth = Math.min(100, state.coreHealth + 15);
                    Audio.sfx('powerup');
                    addFloatText("REPAIRED", p.x, p.y, CONF.colors.power);
                    createExplosion(p.x, p.y, CONF.colors.power, 10);
                    ENTITY.powerups.splice(i, 1);
                    continue;
                }
            }
            if (p.x < 0 || p.x > width || p.y < 0 || p.y > height) ENTITY.powerups.splice(i, 1);
        }

        for (let i = ENTITY.particles.length - 1; i >= 0; i--) {
            let p = ENTITY.particles[i];
            p.x += p.vx * state.slowMo;
            p.y += p.vy * state.slowMo;
            p.life -= 0.02;
            if (p.life <= 0) ENTITY.particles.splice(i, 1);
        }
        for (let i = ENTITY.texts.length - 1; i >= 0; i--) {
            let t = ENTITY.texts[i];
            t.y += t.dy * state.slowMo;
            t.life -= 0.02;
            if (t.life <= 0) ENTITY.texts.splice(i, 1);
        }
        for (let i = ENTITY.ripples.length - 1; i >= 0; i--) {
            let r = ENTITY.ripples[i];
            r.r += 2;
            r.alpha -= 0.05;
            if (r.alpha <= 0) ENTITY.ripples.splice(i, 1);
        }
    }

    function draw() {
        const sx = (Math.random()-0.5) * state.shake;
        const sy = (Math.random()-0.5) * state.shake;
        
        ctx.save();
        ctx.translate(sx, sy);
        ctx.clearRect(-50, -50, width+100, height+100);

        // Grid
        ctx.strokeStyle = 'rgba(0, 240, 255, 0.08)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let i = 0; i < width; i+=50) {
            ctx.moveTo(i, 0); ctx.lineTo(i, height); 
        }
        for (let i = 0; i < height; i+=50) {
            let y = (i + ENTITY.gridOffset) % height;
            ctx.moveTo(0, y); ctx.lineTo(width, y);
        }
        ctx.stroke();

        // Ripples
        ctx.lineWidth = 3;
        ENTITY.ripples.forEach(r => {
            ctx.beginPath();
            ctx.strokeStyle = r.color;
            ctx.globalAlpha = r.alpha;
            ctx.arc(r.x, r.y, r.r, 0, Math.PI*2);
            ctx.stroke();
        });
        ctx.globalAlpha = 1;

        ctx.save();
        ctx.translate(cx, cy);

        // Core
        let pulse = Math.sin(state.frames * 0.1) * 3;
        if (state.coreHealth < 30) pulse = Math.sin(state.frames * 0.5) * 5; 
        
        ctx.shadowBlur = 30;
        ctx.shadowColor = CONF.colors.p1;
        ctx.fillStyle = CONF.colors.p1;
        ctx.beginPath();
        ctx.arc(0, 0, 30 + pulse, 0, Math.PI*2);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.strokeStyle = '#222';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(0, 0, 38, 0, Math.PI*2);
        ctx.stroke();
        
        ctx.strokeStyle = CONF.colors.p1;
        ctx.beginPath();
        ctx.arc(0, 0, 38, 0, Math.PI*2 * (state.coreHealth/100));
        ctx.stroke();

        // Shield
        ctx.rotate(ENTITY.p1.angle);
        ctx.shadowBlur = 15;
        ctx.shadowColor = CONF.colors.p1;
        ctx.strokeStyle = CONF.colors.p1;
        ctx.lineWidth = 8;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(0, 0, ENTITY.p1.radius, -ENTITY.p1.arc/2, ENTITY.p1.arc/2);
        ctx.stroke();
        
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(0, 0, ENTITY.p1.radius + 5, -ENTITY.p1.arc/2, ENTITY.p1.arc/2);
        ctx.stroke();

        ctx.restore(); 

        // Objects
        ENTITY.powerups.forEach(p => {
            ctx.shadowBlur = 10;
            ctx.shadowColor = CONF.colors.power;
            ctx.fillStyle = CONF.colors.power;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 8, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.font = '10px Arial';
            ctx.fillText("+", p.x-3, p.y+3);
        });

        ENTITY.enemies.forEach(e => {
            ctx.save();
            ctx.translate(e.x, e.y);
            ctx.rotate(e.angle + Math.PI + e.rot);
            
            ctx.shadowBlur = 10;
            ctx.shadowColor = e.color;
            ctx.fillStyle = e.color;
            
            ctx.beginPath();
            if (e.type === 'tank') {
                ctx.rect(-e.size, -e.size, e.size*2, e.size*2);
            } else if (e.type === 'dart') {
                ctx.moveTo(e.size*2, 0);
                ctx.lineTo(-e.size, -e.size/2);
                ctx.lineTo(-e.size, e.size/2);
            } else {
                ctx.moveTo(e.size, 0);
                ctx.lineTo(-e.size, -e.size);
                ctx.lineTo(-e.size, e.size);
            }
            ctx.fill();
            
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(-e.size, 0, 2, 0, Math.PI*2);
            ctx.fill();
            
            ctx.restore();
        });

        ctx.shadowBlur = 0;
        ENTITY.particles.forEach(p => {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
            ctx.fill();
        });
        ctx.globalAlpha = 1;

        ctx.font = "bold 16px 'Orbitron', sans-serif";
        ENTITY.texts.forEach(t => {
            ctx.fillStyle = t.color;
            ctx.globalAlpha = t.life;
            ctx.fillText(t.txt, t.x, t.y);
        });
        ctx.globalAlpha = 1;

        // UI Safe Block
        ctx.save();
        const barW = 200;
        ctx.translate(cx - barW/2, 60);
        ctx.fillStyle = '#300';
        ctx.fillRect(0, 0, barW, 6);
        ctx.fillStyle = CONF.colors.p2;
        ctx.shadowBlur = 10;
        ctx.shadowColor = CONF.colors.p2;
        ctx.fillRect(0, 0, barW * (state.p2Energy / 100), 6);
        ctx.restore();

        ctx.restore(); // Final Restore (Shake)
    }

    function loop() {
        if (!state.running || state.paused) return;
        
        try {
            update();
            draw();
            gameLoopId = requestAnimationFrame(loop);
        } catch(e) {
            console.error(e);
            document.getElementById('error-log').innerHTML += e + "<br>";
        }
    }

    function gameOver(winner, reason) {
        state.running = false;
        ui.winnerText.innerText = winner;
        ui.winnerText.style.color = winner.includes('SWARM') ? CONF.colors.p2 : CONF.colors.p1;
        ui.winnerSub.innerText = reason;
        
        ui.statEnemies.innerText = state.enemiesSpawned;
        ui.statCombo.innerText = state.maxCombo;

        ui.over.classList.remove('hidden');
    }

    window.resetGame = function() {
        startGame();
    }
    
    ui.start.classList.remove('hidden');

</script>
</body>
