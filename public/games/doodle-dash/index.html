<!DOCTYPE html>

<style>

.lt{display:inline-block;font-size:clamp(54px,12vw,128px);color:var(--c);transform:rotate(var(--r));animation:pop .7s both;animation-delay:calc(var(--i)*70ms);text-shadow:3px 0 0 var(--ink),-3px 0 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),3px 3px 0 var(--ink),-3px 3px 0 var(--ink),3px -3px 0 var(--ink),-3px -3px 0 var(--ink),7px 9px 0 rgba(23,23,43,.25)}

.tile b{font-size:28px;line-height:1;font-weight:400}.tile small{font-size:13px;opacity:.7;line-height:1.05;height:2.1em;overflow:hidden}
.tile.done{background:#dcfce7}.tile.cur{background:var(--mark);animation:wob 2.4s ease-in-out infinite}
.tile i.nw{position:absolute;top:-9px;right:-6px;background:#e11d48;color:#fff;font-style:normal;font-size:12px;padding:0 7px;border-radius:9px;transform:rotate(8deg)}
#lvt{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0 2px}#lvt .b{font-size:17px;padding:1px 10px}
#lvp{height:10px;border:2px solid var(--ink);border-radius:6px;background:#fff;overflow:hidden;margin:6px auto 0;max-width:340px}#lvp i{display:block;height:100%;background:#22c55e}
#prog{position:fixed;top:0;left:0;right:0;height:6px;background:rgba(23,23,43,.12);z-index:4}#prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#22c55e,#fde047)}
#ban{position:fixed;top:22%;left:50%;transform:translateX(-50%);text-align:center;font-size:clamp(30px,6vw,52px);line-height:1.05;pointer-events:none;z-index:4;opacity:0;background:rgba(253,224,71,.88);padding:4px 26px;border:3px solid var(--ink);border-radius:255px 15px 225px 15px/15px 225px 15px 255px;box-shadow:5px 6px 0 rgba(23,23,43,.2)}
#ban small{font-size:.4em;opacity:.7}#ban i{font-style:normal;font-size:.4em;background:#e11d48;color:#fff;padding:0 8px;border-radius:9px;vertical-align:middle}
#ban.show{animation:bn 2.2s both}@keyframes bn{0%{opacity:0;transform:translateX(-50%) translateY(-24px) rotate(-3deg)}12%,75%{opacity:1;transform:translateX(-50%) rotate(-1.5deg)}100%{opacity:0;transform:translateX(-50%) translateY(-10px) rotate(-1.5deg)}}
body.mn #prog,body.mn #ban{display:none}.b:hover{transform:translateY(-1px) rotate(-.6deg)}#mrow{flex-wrap:wrap;justify-content:center}#top .b{font-size:18px;padding:2px 10px}
#tb{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom,0px));display:none;align-items:center;gap:10px;z-index:5;background:rgba(253,224,71,.95);border:3px solid var(--ink);border-radius:255px 15px 225px 15px/15px 225px 15px 255px;padding:6px 18px;font-size:20px;max-width:min(640px,94vw);box-shadow:4px 5px 0 rgba(23,23,43,.2)}#tb .b{font-size:15px;padding:0 10px;flex:none}body.mn #tb{display:none!important}
.set label{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:12px 0;text-align:left;font-size:21px}.set .b{font-size:18px;padding:1px 14px;min-width:70px}.set input[type=range]{width:150px;accent-color:#2563eb}
.set .pp{display:flex;gap:8px}.set .pp i{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--ink);cursor:pointer}.set .pp i.on{box-shadow:0 0 0 3px var(--mark)}
#toast{position:fixed;top:14%;left:50%;transform:translateX(-50%);text-align:center;font-size:clamp(28px,5.5vw,46px);line-height:1.05;pointer-events:none;z-index:12;opacity:0;background:#fca5a5;padding:4px 26px;border:3px solid var(--ink);border-radius:255px 15px 225px 15px/15px 225px 15px 255px;box-shadow:5px 6px 0 rgba(23,23,43,.25)}#toast small{font-size:.42em;opacity:.75}#toast.show{animation:bn 2.6s both}
#ag{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}#ag .b{font-size:17px;padding:5px 8px;line-height:1.15}#ag .b[disabled]{opacity:.4;cursor:not-allowed}
#pd{font-size:34px;letter-spacing:8px;min-height:46px}#pk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:250px;margin:8px auto}#pk .b{font-size:24px;padding:4px}#pm{color:#e11d48;min-height:1.2em}
#flyb{position:fixed;right:14px;bottom:calc(96px + env(safe-area-inset-bottom,0px));display:none;flex-direction:column;gap:8px;z-index:3}#flyb .b{width:56px;height:56px;padding:0;font-size:22px;border-radius:50%}

<div id="menu"><div><h1 id="logo"></h1><svg id="under" viewBox="0 0 600 30"><path d="M8 20 C90 4 170 28 260 14 S440 6 592 16" stroke="#fde047" stroke-width="13" fill="none" stroke-linecap="round"/><path d="M10 22 C95 8 170 30 262 17 S440 9 590 19" stroke="#17172b" stroke-width="3" fill="none" stroke-linecap="round"/></svg></div>

<script>

{n:'Up We Go',ink:450,s:[60,460],g:[940,300],b:[[0,460,300,100],[560,300,440,260]],sp:[],z:[[280,250,300,260]],st:[[150,420],[430,350],[800,260]],h:'Draw a ramp up to the high ledge. Not too steep!'},
