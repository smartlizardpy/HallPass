<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crimson Survivor</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #gameCanvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            width: 100%;
            max-width: 960px;
            height: auto;
            aspect-ratio: 4 / 3;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.1);
            cursor: crosshair;
        }

        #ui-layer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            width: 100%;
            z-index: 20;
        }

        h1 {
            color: #ff3333;
            text-shadow: 2px 2px 0 #000;
            font-size: 3rem;
            margin-bottom: 10px;
        }

        p {
            color: #ccc;
            background: rgba(0,0,0,0.8);
            display: inline-block;
            padding: 10px 20px;
            border: 1px solid #333;
            border-radius: 5px;
        }

        #hud {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 960px;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            pointer-events: none;
            z-index: 10;
        }

        .hud-text {
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 0px #000;
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 4px;
        }

        #weapon-hud {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            width: 100%;
            pointer-events: none;
            z-index: 10;
        }

        #weaponName {
            color: #ffff00;
            font-size: 1.5rem;
            text-shadow: 1px 1px 2px #000;
        }
        
        #weaponUnlock {
            font-size: 0.9rem;
            color: #aaa;
        }
        
        #weaponAbility {
            font-size: 0.8rem;
            color: #ff9999;
            font-style: italic;
        }

        #health {
            color: #ff4444;
        }

        .hidden {
            display: none !important;
        }

        #crt-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            max-width: 960px;
            aspect-ratio: 4 / 3;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.25) 50%,
                rgba(0,0,0,0.25)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 5;
        }
        
        .floating-alert {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff3333;
            font-size: 2rem;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000, 0 0 10px #ff0000;
            animation: floatUp 2s ease-out forwards;
            pointer-events: none;
            z-index: 30;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.8); }
            20% { transform: translate(-50%, -60%) scale(1.2); }
            80% { opacity: 1; }
            100% { opacity: 0; transform: translate(-50%, -100%) scale(1); }
        }

        /* --- HallPass ------------------------------------------------------
           Online leaderboard and friend challenges. The panel deliberately
           borrows the frame this game already uses for its one block of prose
           (the `p` rule above: rgba(0,0,0,0.8) on a 1px #333 border, 5px
           radius) and inherits Courier New from body, so it reads as a second
           card on the same screen rather than a widget from somewhere else.
           #ff3333 -- the game's title red -- carries the live numbers. */

        /* #ui-layer is pointer-events:none so that aiming and firing pass
           straight through it to the canvas underneath. Anything clickable
           inside it must therefore opt back in explicitly, or it is invisible
           to the mouse and silently dead. */
        .hppanel {
            /* block + fit-content, not inline-block: #ui-layer centres its
               children with text-align, and an inline-block panel would try to
               share a line with the instructions paragraph above it whenever
               the screen is wide enough. This keeps it on its own row and still
               shrinks the frame to the content. */
            display: block;
            width: fit-content;
            max-width: 90%;
            margin: 14px auto 0;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #333;
            border-radius: 5px;
            pointer-events: auto;
            text-align: center;
        }
        .hppanel[hidden] { display: none; }

        .hpbtn {
            font-family: inherit;
            font-size: 0.8rem;
            color: #ccc;
            background: rgba(255, 51, 51, 0.08);
            border: 1px solid #553333;
            border-radius: 5px;
            padding: 6px 14px;
            cursor: pointer;
        }
        .hpbtn:hover {
            color: #fff;
            border-color: #ff3333;
            background: rgba(255, 51, 51, 0.2);
        }
        .hpbtn:disabled { opacity: 0.4; cursor: default; }
        .hpbtn[hidden] { display: none; }

        .hptitle {
            font-size: 0.7rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #777;
            margin-bottom: 8px;
        }
        .hpboard { min-width: 230px; min-height: 22px; }
        /* table-layout:fixed is load-bearing. Without it the browser sizes each
           column to its content, and the ellipsis on .who then collapses a long
           handle to a single letter instead of cutting it off at the column
           edge. Fixed layout lets .who take whatever the other two leave. */
        .hpboard table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        .hpboard td { padding: 3px 0; font-size: 0.85rem; }
        .hpboard .rank { width: 24px; text-align: left; color: #777; }
        .hpboard .who {
            text-align: left;
            color: #ccc;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .hpboard .pts {
            width: 38%;
            text-align: right;
            color: #ff3333;
            font-weight: bold;
        }
        .hpboard .hpv { color: #ff9999; margin-left: 4px; font-size: 0.7rem; }
        .hpempty {
            font-size: 0.7rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #777;
        }
        .hpactions { margin-top: 12px; }
        .hpmsg {
            margin-top: 10px;
            font-size: 0.7rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #777;
        }
        .hpmsg b { color: #ff3333; font-weight: bold; }
        .hpmsg[hidden] { display: none; }
        #hpAuthStatus {
            font-size: 0.7rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #777;
            margin-left: 10px;
        }
        #hpAuthStatus b { color: #ff3333; font-weight: bold; }
    </style>
</head>
<body>

    <div id="hud" class="hidden">
        <div class="hud-text" style="color: #ff4444;">HP: <span id="healthValue">100</span></div>
        <div class="hud-text">SCORE: <span id="scoreValue">0</span></div>
    </div>

    <div id="weapon-hud" class="hidden">
        <div class="hud-text">
            Weapon: <span id="weaponName">Starter Blaster</span><br>
            <span id="weaponAbility">Ability: Basic Piercing</span><br>
            <span id="weaponUnlock">Next unlock at: 50 pts</span><br>
            <span style="font-size:0.8rem; color:#888;">Scroll Mouse Wheel or Q/E to Swap</span>
        </div>
    </div>

    <div id="ui-layer">
        <h1 id="titleText">CRIMSON SURVIVOR</h1>
        <p id="subText">WASD to Move. Mouse to Aim & Shoot.<br>Every weapon has powerful Special Abilities!<br><br>Click anywhere to start.</p>

        <!-- #ui-layer serves BOTH the title screen and the results screen: the
             game only ever rewrites titleText/subText and unhides the layer
             again. So the two HallPass blocks live here side by side, and
             gameOver() decides which one the layer is currently carrying.

             Identity on the title state, board and challenge on the results
             state. That split is not cosmetic: challenge() needs a score on the
             board to dare somebody to beat, so on the title screen the button
             could only ever answer "no-score". -->
        <div class="hppanel" id="hpStart">
            <button class="hpbtn" id="hpSignIn">Sign in</button>
            <span id="hpAuthStatus">Playing as Guest</span>
        </div>
        <div class="hppanel" id="hpOver" hidden>
            <div class="hptitle">Crimson Survivor &middot; High Scores</div>
            <div class="hpboard" id="hpBoard"></div>
            <div class="hpactions">
                <button class="hpbtn" id="hpChallenge">Challenge a friend</button>
            </div>
            <div class="hpmsg" id="hpChallengeMsg" hidden></div>
        </div>
    </div>

    <div id="crt-overlay"></div>
    <canvas id="gameCanvas" width="240" height="180"></canvas>

<!-- HallPass: online leaderboard + friend challenges. The stub below installs

     queued, never lost, and degrade to a safe no-op if it never arrives. -->

return new Promise(function(r){q.push({n:n,a:a,r:r})})}}
w.HallPass=w.HP={version:"0",mode:"loading",_q:q,ready:e("ready"),

signIn:function(){},signOut:function(){},

on:function(){q.push({n:"on",a:[].slice.call(arguments),r:function(){}});return this},
off:function(){q.push({n:"off",a:[].slice.call(arguments),r:function(){}});return this}};
setTimeout(function(){if(w.HallPass.version!=="0")return;w.HallPass.mode="inert";
q.splice(0).forEach(function(c){c.r(c.n==="getScores"||c.n==="getAchievements"||c.n==="unlockMany"?[]:c.n==="getPlayer"||c.n==="setPlayerHandle"?null:c.n==="challenge"?{ok:false,sent:false,reason:"inert"}:{ok:false,reason:"inert"})})},2000)})(window);

<script src="/sdk/v1/hallpass.js" data-game="crimson-survivor" defer></script>

    <script>
        // --- WEAPON ARMORY (With Special Abilities!) ---
        const WEAPONS_LIST = [];
        
        const ABILITY_DESC = {
            "Blaster": "Piercing Rounds",
            "Scatter": "Explosive Shrapnel",
            "Repeater": "Homing Bullets",
            "Cannon": "Massive AoE Blast",
            "Ray": "Chain Lightning",
            "Sawblade": "Bouncing & Massive Bleed",
            "Scythe": "Returning Boomerang",
            "Orbit": "Protective Rotating Orbs",
            "Torrent": "Continuous Short-Range Stream",
            "Vortex": "Gravity Well Pull & Explode"
        };
        
        // Base weapon
        WEAPONS_LIST.push({
            name: "Starter Blaster", type: "Blaster", tier: 1, cd: 0.25, spd: 250, dmg: 1, col: '#ffaa00', spread: 0.05, count: 1, size: 2, reqScore: 0
        });

        // Procedurally generate the remaining weapons to ensure huge variety
        const weaponPrefixes = ["Blood", "Plasma", "Demon", "Ghost", "Hell", "Void", "Crimson", "Shadow", "Abyssal", "Soul"];
        const weaponTypes = ["Blaster", "Scatter", "Repeater", "Cannon", "Ray", "Sawblade", "Scythe", "Orbit", "Torrent", "Vortex"];
        
        let currentReqScore = 50;
        for(let i = 0; i < 80; i++) {
            let p = weaponPrefixes[i % weaponPrefixes.length];
            let t = weaponTypes[Math.floor(i / weaponPrefixes.length) % weaponTypes.length];
            let tier = Math.floor(i / 10) + 1; // Tier 1 to 8
            
            // Unique stats based on archetype and tier
            let count = 1, cd = 0.2, dmg = 1, spd = 200, size = 2, spread = 0.05;
            
            switch(t) {
                case "Blaster": dmg = 1 + tier*0.3; spd = 250 + tier*20; break;
                case "Scatter": count = 3 + tier; spread = 0.4; break;
                case "Repeater": cd = Math.max(0.03, 0.15 - tier*0.01); spread = 0.2; break;
                case "Cannon": cd = 0.7; dmg = 3 + tier*2; spd = 150; size = 4 + tier; break;
                case "Ray": count = 2; spd = 300; break;
                case "Sawblade": count = 1 + Math.floor(tier/3); cd = 0.8; dmg = 2 + tier; spd = 180; size = 6 + tier; spread = 0.3; break;
                case "Scythe": cd = 0.6; dmg = 2 + tier*0.5; spd = 250; size = 5 + tier; break;
                case "Orbit": count = 1 + Math.floor(tier/2); cd = 1.0; dmg = 1.5 + tier*0.5; size = 4 + tier; break;
                case "Torrent": count = 2; cd = 0.05; dmg = 0.5 + tier*0.2; spd = 150 + tier*10; spread = 0.3; size = 4; break;
                case "Vortex": cd = 1.5; dmg = 1 + tier*0.5; spd = 100; size = 8 + tier; break;
            }
            
            // Unique vibrant color for each weapon (shifted towards warm/red colors for horror theme)
            let hue = (i * 25) % 60 + (Math.random() > 0.5 ? 0 : 300); // Reds, Oranges, Yellows, Pinks
            let col = `hsl(${hue}, 100%, 65%)`;

            WEAPONS_LIST.push({
                name: `${p} ${t} Mk${tier}`,
                type: t,
                tier: tier,
                cd: cd, 
                spd: spd, 
                dmg: dmg, 
                col: col, 
                spread: spread, 
                count: count, 
                size: size,
                reqScore: currentReqScore
            });
            
            // Score requirement increases progressively
            currentReqScore += 50 + (tier * 25);
        }

        // --- GAME ENGINE SETUP ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false; 

        // UI Elements
        const uiLayer = document.getElementById('ui-layer');
        const hud = document.getElementById('hud');
        const weaponHud = document.getElementById('weapon-hud');
        const titleText = document.getElementById('titleText');
        const subText = document.getElementById('subText');
        const healthValue = document.getElementById('healthValue');
        const scoreValue = document.getElementById('scoreValue');
        const weaponName = document.getElementById('weaponName');
        const weaponUnlock = document.getElementById('weaponUnlock');
        const weaponAbility = document.getElementById('weaponAbility');
        // The two faces of #ui-layer: identity before a run, results after one.
        const hpStart = document.getElementById('hpStart');
        const hpOver = document.getElementById('hpOver');

        // Game State
        let gameState = 'START';
        let lastTime = 0;
        let score = 0;
        let spawnRate = 2000;
        let lastSpawn = 0;
        let screenShakeTime = 0;
        let screenShakeInt = 0;
        
        // Infinite World State
        let camera = { x: 0, y: 0 };
        let permanentBlood = [];
        let drops = [];

        // Input State
        const keys = { w: false, a: false, s: false, d: false, q: false, e: false };
        let qPressed = false, ePressed = false;
        const mouse = { x: canvas.width / 2, y: canvas.height / 2, down: false };

        // Entity Lists
        let bullets = [];
        let particles = [];
        let enemies = [];
        let explosions = [];

        // --- CLASSES ---

        class Player {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = 6;
                this.speed = 85; 
                this.hp = 100;
                this.shootCooldown = 0;
                
                this.unlockedWeapons = [WEAPONS_LIST[0]];
                this.currentWeaponIdx = 0;
            }

            get weapon() {
                return this.unlockedWeapons[this.currentWeaponIdx];
            }

            update(dt) {
                let dx = 0;
                let dy = 0;
                if (keys.w) dy -= 1;
                if (keys.s) dy += 1;
                if (keys.a) dx -= 1;
                if (keys.d) dx += 1;

                if (dx !== 0 && dy !== 0) {
                    const length = Math.sqrt(dx * dx + dy * dy);
                    dx /= length;
                    dy /= length;
                }

                this.x += dx * this.speed * dt;
                this.y += dy * this.speed * dt;

                if (this.shootCooldown > 0) this.shootCooldown -= dt;
                
                if (mouse.down && this.shootCooldown <= 0) {
                    this.shoot();
                    this.shootCooldown = this.weapon.cd;
                    triggerShake(0.1, this.weapon.size / 1.5);
                }

                if (keys.q && !qPressed) { this.switchWeapon(-1); qPressed = true; } 
                else if (!keys.q) qPressed = false;

                if (keys.e && !ePressed) { this.switchWeapon(1); ePressed = true; } 
                else if (!keys.e) ePressed = false;
            }

            switchWeapon(dir) {
                this.currentWeaponIdx += dir;
                if (this.currentWeaponIdx < 0) this.currentWeaponIdx = this.unlockedWeapons.length - 1;
                if (this.currentWeaponIdx >= this.unlockedWeapons.length) this.currentWeaponIdx = 0;
                updateWeaponUI();
            }

            shoot() {
                let mouseWorldX = mouse.x + camera.x;
                let mouseWorldY = mouse.y + camera.y;
                const angle = Math.atan2(mouseWorldY - this.y, mouseWorldX - this.x);
                const w = this.weapon;

                for(let i=0; i < w.count; i++) {
                    let spreadOffset = 0;
                    if (w.count > 1) {
                        spreadOffset = (i / (w.count - 1) - 0.5) * w.spread;
                    } else {
                        spreadOffset = (Math.random() - 0.5) * w.spread; 
                    }
                    bullets.push(new Bullet(this.x, this.y, angle + spreadOffset, w));
                }
                
                for(let i=0; i<3; i++) {
                    particles.push(new Particle(
                        this.x + Math.cos(angle)*this.size, 
                        this.y + Math.sin(angle)*this.size, 
                        w.col, 150, angle + (Math.random()-0.5), 0.1
                    ));
                }
            }

            draw(ctx) {
                // Player body
                ctx.fillStyle = '#2A4B7C'; 
                ctx.fillRect(this.x - this.size/2, this.y - this.size/2 + 2, this.size, this.size - 2);
                
                // Player head
                ctx.fillStyle = '#FFD3B6'; 
                ctx.fillRect(this.x - this.size/2 + 1, this.y - this.size/2 - 2, this.size - 2, 4);

                // Aiming indicator matched to weapon color
                let mouseWorldX = mouse.x + camera.x;
                let mouseWorldY = mouse.y + camera.y;
                const angle = Math.atan2(mouseWorldY - this.y, mouseWorldX - this.x);
                ctx.strokeStyle = this.weapon.col;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x + Math.cos(angle) * 12, this.y + Math.sin(angle) * 12);
                ctx.stroke();
            }

            takeDamage(amount) {
                this.hp -= amount;
                healthValue.innerText = this.hp;
                
                triggerShake(0.3, 8);
                createBlood(this.x, this.y, 20, '#ff0000');

                if (this.hp <= 0) {
                    this.hp = 0;
                    healthValue.innerText = "0";
                    gameOver();
                }
            }
        }

        class Enemy {
            constructor(x, y, baseHealthScale) {
                this.x = x;
                this.y = y;
                this.size = 8;
                this.baseSpeed = 25 + Math.random() * 20; 
                this.maxHp = 2 + baseHealthScale; 
                this.hp = this.maxHp;
                this.twichTimer = 0;
                this.offsetX = 0;
                this.offsetY = 0;
            }

            update(dt, player) {
                const angle = Math.atan2(player.y - this.y, player.x - this.x);
                
                this.twichTimer -= dt;
                if(this.twichTimer <= 0) {
                    this.offsetX = (Math.random() - 0.5) * 2;
                    this.offsetY = (Math.random() - 0.5) * 2;
                    this.twichTimer = 0.1 + Math.random() * 0.2;
                }

                this.x += (Math.cos(angle) * this.baseSpeed * dt) + this.offsetX;
                this.y += (Math.sin(angle) * this.baseSpeed * dt) + this.offsetY;

                const dist = Math.hypot(player.x - this.x, player.y - this.y);
                if (dist < (this.size/2 + player.size/2)) {
                    player.takeDamage(10);
                    this.x -= Math.cos(angle) * 20;
                    this.y -= Math.sin(angle) * 20;
                }
            }

            draw(ctx) {
                let hpPercent = this.hp / this.maxHp;
                ctx.fillStyle = `rgba(30, 5, 5, ${0.4 + hpPercent * 0.6})`;
                ctx.fillRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
                
                ctx.fillRect(this.x - this.size/2, this.y + this.size/2, 2, 2);
                ctx.fillRect(this.x, this.y + this.size/2, 2, 3);
                ctx.fillRect(this.x + this.size/2 - 2, this.y + this.size/2, 2, 2);
                
                ctx.fillStyle = '#ff0000';
                ctx.fillRect(this.x - 2 + this.offsetX/2, this.y - 2 + this.offsetY/2, 1, 1);
                ctx.fillRect(this.x + 1 + this.offsetX/2, this.y - 2 + this.offsetY/2, 1, 1);
            }

            hit(damage) {
                this.hp -= damage;
                this.baseSpeed *= 0.85; 
                createBlood(this.x, this.y, 5, '#8b0000'); 

                if (this.hp <= 0) {
                    createBlood(this.x, this.y, 25, '#aa0000'); 
                    triggerShake(0.15, 4);
                    addScore(10);
                    
                    // Loot Drop System
                    let roll = Math.random();
                    if (roll < 0.00001) { // 0.001% chance for ultimate weapon
                        drops.push(new Drop(this.x, this.y, 'ultimate'));
                    } else if (roll < 0.08) { // 8% chance for health
                        drops.push(new Drop(this.x, this.y, 'heal'));
                    }
                    
                    return true; 
                }
                return false; 
            }
        }

        class Bullet {
            constructor(x, y, angle, weapon, chainedFrom = null) {
                this.x = x;
                this.y = y;
                this.vx = Math.cos(angle) * weapon.spd;
                this.vy = Math.sin(angle) * weapon.spd;
                this.dmg = weapon.dmg;
                this.size = weapon.size;
                this.color = weapon.col;
                this.type = weapon.type;
                this.tier = weapon.tier;
                
                // Specific Abilities logic
                this.maxLife = (this.type === 'Sawblade' || this.type === 'Orbit' || this.type === 'Vortex') ? 4.0 : (this.type === 'Torrent' ? 0.3 : 1.5);
                this.life = this.maxLife; 
                this.pierce = (this.type === 'Blaster' || this.type === 'Scythe') ? this.tier : 0;
                this.hasChained = chainedFrom !== null; 
                this.hitEnemies = new Set();
                if (chainedFrom) this.hitEnemies.add(chainedFrom); // Don't hit the enemy it chained from
                this.rotation = 0;
                
                if (this.type === 'Orbit') {
                    this.orbitAngle = angle;
                    this.orbitDist = 40 + this.tier * 5;
                }
            }

            update(dt) {
                // Homing Ability for Repeater
                if (this.type === 'Repeater' && enemies.length > 0) {
                    let closest = null; let minDist = Infinity;
                    enemies.forEach(e => {
                        let d = Math.hypot(this.x - e.x, this.y - e.y);
                        if (d < minDist) { minDist = d; closest = e; }
                    });
                    
                    if (closest && minDist < 150) {
                        let targetAngle = Math.atan2(closest.y - this.y, closest.x - this.x);
                        let currentAngle = Math.atan2(this.vy, this.vx);
                        let diff = targetAngle - currentAngle;
                        while (diff < -Math.PI) diff += Math.PI*2;
                        while (diff > Math.PI) diff -= Math.PI*2;
                        
                        currentAngle += diff * 5 * dt; // Turn speed
                        let spd = Math.hypot(this.vx, this.vy);
                        this.vx = Math.cos(currentAngle) * spd;
                        this.vy = Math.sin(currentAngle) * spd;
                    }
                }

                // Bounce Ability for Sawblade
                if (this.type === 'Sawblade') {
                    this.rotation += 15 * dt; // Spin
                    if (this.x < camera.x || this.x > camera.x + canvas.width) {
                        this.vx *= -1;
                        this.x = Math.max(camera.x, Math.min(camera.x + canvas.width, this.x));
                    }
                    if (this.y < camera.y || this.y > camera.y + canvas.height) {
                        this.vy *= -1;
                        this.y = Math.max(camera.y, Math.min(camera.y + canvas.height, this.y));
                    }
                }
                
                // Returning Boomerang for Scythe
                if (this.type === 'Scythe') {
                    this.rotation += 20 * dt;
                    if (this.life < this.maxLife * 0.5) {
                        let targetAngle = Math.atan2(player.y - this.y, player.x - this.x);
                        let spd = Math.hypot(this.vx, this.vy) + 100 * dt; // accelerate back
                        this.vx = Math.cos(targetAngle) * spd;
                        this.vy = Math.sin(targetAngle) * spd;
                    }
                }
                
                // Orbiting Orbs
                if (this.type === 'Orbit') {
                    this.orbitAngle += 4 * dt;
                    this.x = player.x + Math.cos(this.orbitAngle) * this.orbitDist;
                    this.y = player.y + Math.sin(this.orbitAngle) * this.orbitDist;
                }
                
                // Gravity Well for Vortex
                if (this.type === 'Vortex') {
                    this.rotation += 5 * dt;
                    enemies.forEach(e => {
                        let dist = Math.hypot(this.x - e.x, this.y - e.y);
                        if (dist < 120) {
                            let angle = Math.atan2(this.y - e.y, this.x - e.x);
                            e.x += Math.cos(angle) * (50 + this.tier * 10) * dt;
                            e.y += Math.sin(angle) * (50 + this.tier * 10) * dt;
                        }
                    });
                }
                
                // Short-range stream for Torrent
                if (this.type === 'Torrent') {
                    this.vx *= Math.pow(0.01, dt); // massive drag
                    this.vy *= Math.pow(0.01, dt);
                    this.size += 20 * dt; // expands
                }

                // Orbit handles position directly, others use velocity
                if (this.type !== 'Orbit') {
                    this.x += this.vx * dt;
                    this.y += this.vy * dt;
                }
                
                this.life -= dt;
            }

            draw(ctx) {
                ctx.fillStyle = this.color;
                
                if (this.type === 'Sawblade' || this.type === 'Scythe') {
                    // Draw spinning shapes
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.rotation);
                    if (this.type === 'Sawblade') {
                        ctx.fillRect(-this.size/2, -this.size/6, this.size, this.size/3);
                        ctx.fillRect(-this.size/6, -this.size/2, this.size/3, this.size);
                        // Inner gear hole
                        ctx.fillStyle = '#000';
                        ctx.fillRect(-1, -1, 2, 2);
                    } else { // Scythe half-moon
                        ctx.beginPath();
                        ctx.arc(0, 0, this.size, 0, Math.PI, false);
                        ctx.fill();
                    }
                    ctx.restore();
                } else if (this.type === 'Orbit') {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size/2, 0, Math.PI*2);
                    ctx.fill();
                } else if (this.type === 'Vortex') {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.rotation);
                    ctx.fillStyle = '#110022'; // Dark core
                    ctx.beginPath(); ctx.arc(0,0, this.size, 0, Math.PI*2); ctx.fill();
                    ctx.strokeStyle = this.color; ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.restore();
                } else if (this.type === 'Torrent') {
                    ctx.globalAlpha = Math.max(0, this.life / this.maxLife);
                    ctx.beginPath(); ctx.arc(this.x, this.y, this.size/2, 0, Math.PI*2); ctx.fill();
                    ctx.globalAlpha = 1.0;
                } else {
                    ctx.fillRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
                }
            }
        }

        class Particle {
            constructor(x, y, color, speed, angle, friction = 0.9) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.vx = Math.cos(angle) * speed * Math.random();
                this.vy = Math.sin(angle) * speed * Math.random();
                this.friction = friction;
                this.life = 1.0;
                let rand = Math.random();
                this.size = rand > 0.9 ? 4 : (rand > 0.6 ? 2 : 1);
                this.stopped = false;
            }

            update(dt) {
                if (this.stopped) return;

                this.x += this.vx * dt;
                this.y += this.vy * dt;
                
                this.vx *= Math.pow(this.friction, dt * 60); 
                this.vy *= Math.pow(this.friction, dt * 60);

                if (Math.abs(this.vx) < 5 && Math.abs(this.vy) < 5) {
                    this.stopped = true;
                    permanentBlood.push({x: Math.floor(this.x), y: Math.floor(this.y), col: this.color, size: this.size});
                    if (permanentBlood.length > 2000) permanentBlood.shift(); // Keep memory clear
                }
                
                this.life -= dt;
            }

            draw(ctx) {
                if (!this.stopped) {
                    ctx.fillStyle = this.color;
                    ctx.fillRect(this.x, this.y, this.size, this.size);
                }
            }
        }

        class Drop {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.size = type === 'heal' ? 6 : 10;
                this.life = 20.0; // Despawns after 20 seconds
                this.pulse = 0;
            }

            update(dt) {
                this.life -= dt;
                this.pulse += dt * 5;
            }

            draw(ctx) {
                // Flash rapidly if about to despawn
                if (this.life < 3 && Math.floor(this.pulse * 2) % 2 === 0) return;

                if (this.type === 'heal') {
                    ctx.fillStyle = '#00ff00'; // Bright green for healing
                    let s = this.size + Math.sin(this.pulse) * 1.5;
                    ctx.fillRect(this.x - s/2, this.y - s/6, s, s/3); // Horizontal bar
                    ctx.fillRect(this.x - s/6, this.y - s/2, s/3, s); // Vertical bar
                } else if (this.type === 'ultimate') {
                    // Rainbow pulsing orb
                    ctx.fillStyle = `hsl(${this.pulse * 50 % 360}, 100%, 60%)`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size + Math.sin(this.pulse) * 3, 0, Math.PI*2);
                    ctx.fill();
                }
            }
        }

        let player;

        // --- CORE FUNCTIONS ---
        
        function pseudoRandom(x, y) {
            let n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
            return n - Math.floor(n);
        }

        function initGame() {
            player = new Player(canvas.width / 2, canvas.height / 2);
            enemies = [];
            bullets = [];
            particles = [];
            explosions = [];
            permanentBlood = [];
            drops = [];
            camera = { x: 0, y: 0 };
            hpPosted = false;
            score = 0;
            scoreValue.innerText = "0";
            healthValue.innerText = "100";
            spawnRate = 2000;

            gameState = 'PLAYING';
            uiLayer.classList.add('hidden');
            hud.classList.remove('hidden');
            weaponHud.classList.remove('hidden');
            updateWeaponUI();
            
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function drawScenery(ctx) {
            let chunkSize = 40;
            let startX = Math.floor(camera.x / chunkSize) - 1;
            let startY = Math.floor(camera.y / chunkSize) - 1;
            let endX = startX + Math.ceil(canvas.width / chunkSize) + 2;
            let endY = startY + Math.ceil(canvas.height / chunkSize) + 2;

            for (let cx = startX; cx <= endX; cx++) {
                for (let cy = startY; cy <= endY; cy++) {
                    let r = pseudoRandom(cx, cy);
                    if (r > 0.85) { 
                        let type = pseudoRandom(cx+1, cy+1) > 0.6 ? 'tomb' : 'tree';
                        let px = cx * chunkSize + pseudoRandom(cx+2, cy+2) * 20;
                        let py = cy * chunkSize + pseudoRandom(cx+3, cy+3) * 20;

                        if (type === 'tomb') {
                            ctx.fillStyle = '#3a2b2b'; ctx.fillRect(px, py, 6, 8);
                            ctx.fillStyle = '#2b1b1b'; ctx.fillRect(px+1, py+1, 4, 6);
                        } else {
                            ctx.fillStyle = '#1a0d0d'; ctx.fillRect(px, py, 4, 14);
                            ctx.fillRect(px-3, py+3, 10, 2);
                        }
                    } else if (r < 0.2) { 
                        let px = cx * chunkSize + pseudoRandom(cx+4, cy+4) * 30;
                        let py = cy * chunkSize + pseudoRandom(cx+5, cy+5) * 30;
                        ctx.fillStyle = r < 0.1 ? '#150a0a' : '#0a0505';
                        ctx.fillRect(px, py, 1, 1);
                    }
                }
            }
        }

        function createBlood(x, y, amount, color) {
            let actualAmount = amount * 3;
            for(let i=0; i<actualAmount; i++) {
                particles.push(new Particle(
                    x, y, color, 
                    60 + Math.random() * 160, 
                    Math.random() * Math.PI * 2,
                    0.80 
                ));
            }
        }
        
        // Special Ability: AoE Explosions
        function createExplosion(x, y, radius, dmg, sourceColor) {
            explosions.push({ x: x, y: y, r: radius, life: 0.2, maxLife: 0.2, col: sourceColor });
            
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                let dist = Math.hypot(e.x - x, e.y - y);
                if (dist <= radius) {
                    if (e.hit(dmg)) {
                        enemies.splice(i, 1);
                    }
                }
            }
        }
        
        // Special Ability: Chain Lightning
        function chainRay(bullet, hitEnemy) {
            let closest = null; 
            let minDist = 80; // Max chain distance
            
            enemies.forEach(e => {
                if (e === hitEnemy) return;
                let d = Math.hypot(hitEnemy.x - e.x, hitEnemy.y - e.y);
                if (d < minDist) { minDist = d; closest = e; }
            });
            
            if (closest) {
                let angle = Math.atan2(closest.y - hitEnemy.y, closest.x - hitEnemy.x);
                let newBullet = new Bullet(hitEnemy.x, hitEnemy.y, angle, player.weapon, hitEnemy);
                newBullet.hasChained = true; // Prevent infinite chaining
                bullets.push(newBullet);
            }
        }

        function spawnEnemy() {
            let ex, ey;
            if (Math.random() > 0.5) {
                ex = camera.x + (Math.random() > 0.5 ? -20 : canvas.width + 20);
                ey = camera.y + Math.random() * canvas.height;
            } else {
                ex = camera.x + Math.random() * canvas.width;
                ey = camera.y + (Math.random() > 0.5 ? -20 : canvas.height + 20);
            }
            
            let healthScale = Math.floor(score / 200);
            enemies.push(new Enemy(ex, ey, healthScale));
        }

        function addScore(pts) {
            score += pts;
            scoreValue.innerText = score;
            checkUnlocks();
        }

        function checkUnlocks() {
            let nextWeapon = WEAPONS_LIST[player.unlockedWeapons.length];
            if (nextWeapon && score >= nextWeapon.reqScore) {
                player.unlockedWeapons.push(nextWeapon);
                player.currentWeaponIdx = player.unlockedWeapons.length - 1;
                
                showUnlockAlert(nextWeapon.name);
                updateWeaponUI();
                checkUnlocks();
            }
        }

        function updateWeaponUI() {
            let w = player.weapon;
            weaponName.innerText = w.name;
            weaponName.style.color = w.col;
            weaponAbility.innerText = "Ability: " + ABILITY_DESC[w.type];
            weaponAbility.style.color = w.col;
            
            let nextWeapon = WEAPONS_LIST[player.unlockedWeapons.length];
            if (nextWeapon) {
                weaponUnlock.innerText = `Next unlock at: ${nextWeapon.reqScore} pts`;
            } else {
                weaponUnlock.innerText = "All Weapons Unlocked!";
            }
        }

        function showUnlockAlert(name) {
            const alert = document.createElement('div');
            alert.className = 'floating-alert';
            alert.innerText = `UNLOCKED: ${name}!`;
            document.body.appendChild(alert);
            setTimeout(() => alert.remove(), 2000);
        }

        /* Whether the run that just ended has already been posted to HallPass.
           gameOver() is reached from Player.takeDamage(), which runs inside the
           per-enemy collision pass -- so two enemies landing on the same frame
           can drive hp below zero twice and call it twice. A duplicate row on
           the leaderboard for one run is not something to leave to the hope
           that they never overlap. initGame() clears it, and initGame() is the
           only way a new run begins. */
        let hpPosted = false;

        function gameOver() {
            gameState = 'GAMEOVER';
            uiLayer.classList.remove('hidden');
            hud.classList.add('hidden');
            weaponHud.classList.add('hidden');
            titleText.innerText = "YOU WERE DRAGGED INTO THE DARKNESS!";
            subText.innerHTML = `Final Score: ${score}<br>Weapons Unlocked: ${player.unlockedWeapons.length}/${WEAPONS_LIST.length}<br><br>Click to Play Again`;
            document.body.style.cursor = 'default';

            /* Turn #ui-layer from the title screen into the results screen.
               Explicit, and part of entering GAMEOVER rather than a side effect
               somewhere else, because the same element carries both and nothing
               would otherwise take the sign-in row down or put the board up. */
            hpStart.hidden = true;
            hpOver.hidden = false;

            /* Post the run. submitScore resolves either way and never throws --
               including against a board that does not exist yet -- so this can
               neither stop the death screen appearing nor delay it. An
               anonymous player posts under a Guest name, a signed-in one under
               their own. The board is drawn only AFTER the post resolves, so
               the run that just ended is already in the list instead of turning
               up one death late. */
            if (!hpPosted) {
                hpPosted = true;
                const board = document.getElementById('hpBoard');
                if (board) board.innerHTML = '<div class="hpempty">Posting your score...</div>';
                // Clear the previous run's result, or "Dared Ali to beat 1,200"
                // would sit under a score nobody is talking about any more.
                const msg = document.getElementById('hpChallengeMsg');
                if (msg) msg.hidden = true;
                HallPass.submitScore(score).then(hpRenderBoard);
            }
        }

        function drawLighting(screenX, screenY) {
            const flicker = Math.random() * 5 - 2.5;
            const radiusInner = 30 + flicker;
            const radiusOuter = 130 + flicker * 2;

            const gradient = ctx.createRadialGradient(
                screenX, screenY, radiusInner, 
                screenX, screenY, radiusOuter
            );
            
            let ambientR = player.hp < 30 ? 40 + Math.sin(performance.now() / 100) * 30 : 15;
            
            gradient.addColorStop(0, 'rgba(0, 0, 0, 0)');
            gradient.addColorStop(0.5, `rgba(${ambientR}, 2, 2, 0.85)`); 
            gradient.addColorStop(1, 'rgba(5, 0, 0, 0.99)'); 

            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        
        function triggerShake(time, intensity) {
            screenShakeTime = time;
            screenShakeInt = intensity;
        }

        // --- MAIN LOOP ---

        function gameLoop(timestamp) {
            if (gameState !== 'PLAYING') return;

            const dt = (timestamp - lastTime) / 1000;
            lastTime = timestamp;

            // Camera follow player
            camera.x = player.x - canvas.width / 2;
            camera.y = player.y - canvas.height / 2;

            ctx.setTransform(1, 0, 0, 1, 0, 0);
            
            if (screenShakeTime > 0) {
                ctx.translate((Math.random() - 0.5) * screenShakeInt, (Math.random() - 0.5) * screenShakeInt);
                screenShakeTime -= dt;
            }

            // 1. UPDATE
            player.update(dt);

            if (timestamp - lastSpawn > spawnRate) {
                spawnEnemy();
                lastSpawn = timestamp;
                spawnRate = Math.max(250, spawnRate - 10); 
            }

            // Update Bullets & Check Collisions
            for (let bIndex = bullets.length - 1; bIndex >= 0; bIndex--) {
                let b = bullets[bIndex];
                b.update(dt);

                let isOutOfBounds = (b.x < camera.x - 200 || b.x > camera.x + canvas.width + 200 || b.y < camera.y - 200 || b.y > camera.y + canvas.height + 200);
                // Sawblade, Orbit, Scythe, Vortex ignore out of bounds logic
                if (b.type === 'Sawblade' || b.type === 'Orbit' || b.type === 'Scythe' || b.type === 'Vortex') {
                    isOutOfBounds = false;
                }

                if (b.life <= 0 || isOutOfBounds) {
                    if (b.type === 'Vortex') {
                         createExplosion(b.x, b.y, 60 + b.tier * 10, b.dmg * 3, b.color);
                         triggerShake(0.2, 5);
                    }
                    bullets.splice(bIndex, 1);
                    continue;
                }

                let bulletDestroyed = false;

                for (let eIndex = enemies.length - 1; eIndex >= 0; eIndex--) {
                    let e = enemies[eIndex];
                    if (b.hitEnemies.has(e)) continue; // Prevent multi-hitting same enemy in one tick

                    const dist = Math.hypot(b.x - e.x, b.y - e.y);
                    if (dist < (e.size/2 + b.size/2 + 2)) {
                        b.hitEnemies.add(e);
                        
                        // --- APPLY SPECIAL WEAPON ABILITIES ---
                        
                        if (b.type === 'Sawblade' || b.type === 'Scythe') {
                            // Massive extra bleed effect!
                            createBlood(e.x, e.y, 10 + b.tier * 2, '#ff0000'); 
                            createBlood(e.x, e.y, 5, '#ff5555'); 
                        } else if (b.type === 'Cannon') {
                            createExplosion(b.x, b.y, 40 + b.tier * 5, b.dmg, b.color);
                        } else if (b.type === 'Scatter') {
                            createExplosion(b.x, b.y, 20 + b.tier * 2, b.dmg/2, b.color);
                        } else if (b.type === 'Ray' && !b.hasChained) {
                            chainRay(b, e);
                            b.hasChained = true;
                        }

                        // Apply standard damage
                        if (e.hit(b.dmg)) {
                            enemies.splice(eIndex, 1);
                        }

                        // Should the bullet survive the impact?
                        if (b.type === 'Sawblade' || b.type === 'Orbit' || b.type === 'Vortex') {
                            // These never stop on impact!
                        } else if ((b.type === 'Blaster' || b.type === 'Scythe') && b.pierce > 0) {
                            b.pierce--; // Pierces and keeps going
                        } else {
                            bulletDestroyed = true; // Destroy bullet
                            break; 
                        }
                    }
                }

                if (bulletDestroyed) {
                    bullets.splice(bIndex, 1);
                }
            }
            
            // Update Enemies tracking player
            enemies.forEach((e) => {
                e.update(dt, player);
            });

            // Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update(dt);
                if (particles[i].life <= 0 || particles[i].stopped) {
                    particles.splice(i, 1);
                }
            }
            
            // Update Explosions
            for (let i = explosions.length - 1; i >= 0; i--) {
                explosions[i].life -= dt;
                if (explosions[i].life <= 0) explosions.splice(i, 1);
            }

            // Update Drops & Check Pickup
            for (let i = drops.length - 1; i >= 0; i--) {
                let d = drops[i];
                d.update(dt);
                if (d.life <= 0) {
                    drops.splice(i, 1);
                    continue;
                }
                
                let dist = Math.hypot(player.x - d.x, player.y - d.y);
                if (dist < (player.size/2 + d.size)) {
                    if (d.type === 'heal') {
                        player.hp = Math.min(100, player.hp + 25); // Heals 25 HP
                        healthValue.innerText = player.hp;
                        // Flash health UI green
                        healthValue.style.color = '#00ff00';
                        setTimeout(() => healthValue.style.color = '', 500);
                    } else if (d.type === 'ultimate') {
                        let ultimateWeapon = WEAPONS_LIST[WEAPONS_LIST.length - 1];
                        if (!player.unlockedWeapons.includes(ultimateWeapon)) {
                            player.unlockedWeapons.push(ultimateWeapon);
                        }
                        player.currentWeaponIdx = player.unlockedWeapons.indexOf(ultimateWeapon);
                        updateWeaponUI();
                        showUnlockAlert("MYTHIC WEAPON FOUND!");
                    }
                    drops.splice(i, 1);
                }
            }

            // 2. DRAW
            
            // Draw pure background color
            ctx.fillStyle = '#080505'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Apply camera translation for all world elements
            ctx.save();
            ctx.translate(Math.floor(-camera.x), Math.floor(-camera.y));

            drawScenery(ctx);

            // Draw permanent blood layer
            permanentBlood.forEach(b => {
                if (b.x > camera.x - 5 && b.x < camera.x + canvas.width + 5 && 
                    b.y > camera.y - 5 && b.y < camera.y + canvas.height + 5) {
                    ctx.fillStyle = b.col;
                    ctx.globalAlpha = 0.5;
                    ctx.fillRect(b.x, b.y, b.size, b.size);
                }
            });
            ctx.globalAlpha = 1.0;

            particles.forEach(p => p.draw(ctx));
            
            // Draw Explosions
            explosions.forEach(exp => {
                ctx.globalAlpha = exp.life / exp.maxLife;
                ctx.fillStyle = exp.col;
                ctx.beginPath();
                ctx.arc(exp.x, exp.y, exp.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            });
            
            drops.forEach(d => d.draw(ctx));
            bullets.forEach(b => b.draw(ctx));
            enemies.forEach(e => e.draw(ctx));
            player.draw(ctx);

            ctx.restore();

            // 3. APPLY ATMOSPHERE
            drawLighting(player.x - camera.x, player.y - camera.y);

            requestAnimationFrame(gameLoop);
        }

        // --- INPUT LISTENERS ---

        window.addEventListener('keydown', (e) => {
            if (keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true;
        });

        window.addEventListener('keyup', (e) => {
            if (keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false;
        });

        window.addEventListener('wheel', (e) => {
            if (gameState === 'PLAYING') {
                if (e.deltaY < 0) player.switchWeapon(-1); 
                if (e.deltaY > 0) player.switchWeapon(1);  
            }
        });

        function updateMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            mouse.x = (e.clientX - rect.left) * scaleX;
            mouse.y = (e.clientY - rect.top) * scaleY;
        }

        window.addEventListener('mousemove', updateMousePos);

        window.addEventListener('mousedown', (e) => {
            mouse.down = true;
            if (gameState === 'START' || gameState === 'GAMEOVER') {
                document.body.style.cursor = 'crosshair';
                initGame();
            }
        });

        window.addEventListener('mouseup', () => {
            mouse.down = false;
        });

        /* --- HallPass ------------------------------------------------------
           The inline stub above this script guarantees window.HallPass exists
           by the time any of this runs, and every method resolves rather than
           throwing -- so nothing in this section can break the game, even with
           no network at all, and even before this game has a leaderboard
           server-side. Nothing here is wrapped in try/catch because there is
           nothing to catch. */

        /* This game restarts on ANY mousedown while the title or death screen
           is up (see the window listener above -- it does not care what was
           clicked). Left alone, that means pressing "Sign in" or "Challenge a
           friend" would throw the player straight into a fresh run instead, and
           reading the leaderboard would be impossible. The window listener is
           the last stop on the bubble path, so swallowing the event at the
           panel keeps it from ever getting there.

           mousedown specifically, not pointerdown: mousedown is the event the
           restart is bound to, and it is also what a touch tap synthesises, so
           this covers phones too. Stopping it here also means `mouse.down`
           never latches true from a click on the panel -- so no phantom firing
           when the next run starts. */
        [hpStart, hpOver].forEach((panel) => {
            panel.addEventListener('mousedown', (e) => e.stopPropagation());
        });

        /* Paint the identity row. `p` is null when signed out. */
        function hpRefreshAuth(p) {
            const status = document.getElementById('hpAuthStatus');
            const btn = document.getElementById('hpSignIn');
            if (!status || !btn) return;
            if (p) {
                btn.hidden = true;
                status.innerHTML = 'Signed in as <b></b>';
                // textContent: a display name is untrusted input and must never be parsed.
                status.querySelector('b').textContent = p.name;
            } else {
                btn.hidden = false;
                status.textContent = 'Playing as Guest';
            }
        }

        /* Draw the online top five onto the death screen.

           FIVE rows, not ten: this screen sits in the middle of a 4:3 arena
           over the two lines the game already writes there, and a list long
           enough to need scrolling would put a scroll region on top of the
           canvas the player aims through. The full board lives on the game's
           HallPass page.

           TEN are REQUESTED because one player can hold several of the top
           rows; after collapsing each handle to their best run, five is what is
           left to show. */
        function hpRenderBoard() {
            const el = document.getElementById('hpBoard');
            if (!el) return;
            el.innerHTML = '<div class="hpempty">Loading scores...</div>';
            HallPass.getScores({ limit: 10 }).then((rows) => {
                if (!rows || !rows.length) {
                    el.innerHTML = '<div class="hpempty">Be the first to score</div>';
                    return;
                }
                const seen = new Set();
                const best = rows.filter((r) => seen.has(r.handle) ? false : (seen.add(r.handle), true))
                                 .slice(0, 5);
                const table = document.createElement('table');
                let rank = 0;
                for (const row of best) {
                    const tr = document.createElement('tr');
                    const n = document.createElement('td');
                    n.className = 'rank'; n.textContent = ++rank;
                    const who = document.createElement('td');
                    who.className = 'who';
                    // textContent throughout: a handle is untrusted and must never be parsed.
                    who.textContent = row.handle;
                    if (row.verified) {
                        const tick = document.createElement('span');
                        tick.className = 'hpv'; tick.textContent = '✓';
                        who.appendChild(tick);
                    }
                    const pts = document.createElement('td');
                    pts.className = 'pts'; pts.textContent = Number(row.score).toLocaleString();
                    tr.append(n, who, pts);
                    table.appendChild(tr);
                }
                el.innerHTML = '';
                el.appendChild(table);
            });
        }

        /* Challenge a friend to beat the run that just ended.

           Only the outcomes the PICKER CANNOT REPORT ITSELF are written here.
           Server refusals (signed-out, not-friends, no-score...) are already
           rendered inside the panel the player is looking at, and saying them
           twice would be noise. These three stop the panel before it can say
           anything at all. */
        const HP_CHALLENGE_MSG = {
            "popup-blocked": "Your browser blocked the challenge window",
            "inert":         "Challenges need the online leaderboard, offline here",
            "network":       "Could not reach HallPass - try again shortly",
        };

        document.getElementById('hpChallenge').addEventListener('click', async () => {
            const btn = document.getElementById('hpChallenge');
            const msg = document.getElementById('hpChallengeMsg');
            btn.disabled = true;
            msg.hidden = true;
            // No try/catch: every SDK method resolves, so there is nothing to catch.
            const res = await HallPass.challenge();
            btn.disabled = false;

            // READ `sent`, NOT `ok`. Closing the picker resolves
            // { ok:true, sent:false, reason:"closed" } -- the call worked and the
            // player changed their mind, which must never be shown as a failure.
            if (res && res.sent && res.challenge) {
                msg.innerHTML = 'Dared <b></b> to beat <b></b>';
                const parts = msg.querySelectorAll('b');
                parts[0].textContent = res.challenge.to;   // untrusted display name
                parts[1].textContent = Number(res.challenge.targetScore).toLocaleString();
                msg.hidden = false;
                return;
            }
            const text = res && res.reason ? HP_CHALLENGE_MSG[res.reason] : null;
            if (text) { msg.textContent = text; msg.hidden = false; }
        });

        HallPass.getPlayer().then(hpRefreshAuth);
        // The popup does not reload the game, so the label has to be told when
        // it finishes -- otherwise it still reads "Guest" to somebody who has
        // just signed in.
        HallPass.on('auth', (e) => hpRefreshAuth(e.player));
        // Must be a real click: browsers block a popup opened without a user gesture.
        document.getElementById('hpSignIn').addEventListener('click', () => HallPass.signIn());

        
        // Initial drawing for menu screen
        ctx.fillStyle = '#080505';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
    </script>
</body>
</html>
