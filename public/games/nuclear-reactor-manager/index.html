        // --- DRAW HUD (Fixed to Screen) ---
        if (shakeTimer > 0) {
            drawPixelRect(0, 110, GAME_WIDTH, 40, 'rgba(255, 0, 0, 0.8)');
            drawText("WARNING: SEISMIC EVENT DETECTED - MULTIPLE RUPTURES", GAME_WIDTH/2, 120, 24, '#fff', 'center');
        }

        // Expanded HUD to fit Educational Ticker
        drawPixelRect(0, 0, GAME_WIDTH, 110, '#0a0a0a');
        drawPixelRect(0, 110, GAME_WIDTH, 4, '#33ff33');

        // Scrambler function for HUD
        const sc = (val) => {
            if (!isScrambled) return Math.floor(val);
            const chars = '!@#$%&*?';
            return chars[Math.floor(Math.random()*chars.length)] + chars[Math.floor(Math.random()*chars.length)] + chars[Math.floor(Math.random()*chars.length)];
        };

        // 1. Time & Money & Stocks
        drawText(`TIME: ${Math.floor(timeOfDay)}:00 | DAY: ${daysSurvived}${isEndless ? '+' : '/' + TARGET_DAYS}`, 20, 10, 24, '#33ff33');
        let moneyColor = reactor.money < 0 ? '#ff3333' : '#33ff33';
        drawText(`FUNDS: $${Math.floor(reactor.money)}`, 20, 35, 24, moneyColor);
        drawText(`SHARES: ${reactor.shares} @ $${Math.floor(reactor.stockPrice)}`, 20, 60, 20, '#00ff00');

        // 2. Heat & Pressure (Center)
        let coreColor = reactor.heat > 800 ? '#ff3333' : (reactor.heat > 500 ? '#ffff00' : '#33ff33');
        drawText(`CORE TEMP: ${sc(reactor.heat)}°C`, 260, 10, 24, isScrambled ? '#ff3333' : coreColor);
        drawPixelRect(260, 35, 180, 12, '#222');
        if (!isScrambled) drawPixelRect(260, 35, (reactor.heat / MAX_HEAT) * 180, 12, coreColor);
        
        let pressColor = reactor.pressure > 80 ? '#ff3333' : '#aaddff';
        drawText(`PRESSURE: ${sc(reactor.pressure)}%`, 260, 55, 20, isScrambled ? '#ff3333' : pressColor);
        drawPixelRect(260, 75, 180, 8, '#222');
        if (!isScrambled) drawPixelRect(260, 75, (reactor.pressure / 100) * 180, 8, pressColor);

        // 3. Systems (Mid-Right)
        drawText(`RODS: ${sc(reactor.controlRods)}%`, 460, 10, 20, isScrambled ? '#ff3333' : '#33ff33');
        drawText(`PUMPS: ${sc(reactor.pumpPower)}%`, 460, 30, 20, isScrambled ? '#ff3333' : '#33ff33');
        drawText(`OUTPUT: ${sc(reactor.energyOutput)} MW`, 460, 50, 20, '#ffff00');
        
        let turbColor = reactor.turbineCondition < 50 ? '#ff3333' : '#33ff33';
        drawText(`TURBINE: ${sc(reactor.turbineCondition)}%`, 460, 70, 20, turbColor);

        // 4. Trust & Waste (Far Right)
        let trustColor = reactor.trust > 50 ? '#33ff33' : (reactor.trust > 25 ? '#ffb000' : '#ff3333');
        drawText(`PUBLIC TRUST: ${Math.floor(reactor.trust)}%`, 620, 10, 20, trustColor);
        drawPixelRect(620, 30, 150, 15, '#222');
        drawPixelRect(620, 30, (reactor.trust / 100) * 150, 15, trustColor);
        
        // Educational Impact Metrics
        drawText(`CO2 AVOIDED: ${Math.floor(reactor.co2Avoided)}t`, 620, 50, 20, '#aaddff'); 
        drawText(`LIVES SAVED: ${Math.floor(reactor.livesSaved)}`, 620, 70, 20, '#aaddff'); 

        // 5. Educational News Ticker (Bottom of HUD)
        drawPixelRect(0, 90, GAME_WIDTH, 20, '#112211');
        ctx.font = `20px 'VT323', monospace`;
        let factWidth = ctx.measureText(eduFacts[currentFactIdx]).width;
        if (tickerX < -factWidth) {
            tickerX = GAME_WIDTH;
            currentFactIdx = (currentFactIdx + 1) % eduFacts.length;
        }
        drawText(eduFacts[currentFactIdx], tickerX, 92, 20, '#00ff00');

        // --- CINEMATIC OVERLAYS (Drawn over the frozen world) ---

        if (gameState === 'GAMEOVER') {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
            drawText("INCIDENT REPORT", GAME_WIDTH/2, 160, 60, '#ff3333', 'center');
            drawText(failReason, GAME_WIDTH/2, 230, 24, '#fff', 'center');
            
            drawText(`Years Survived: ${daysSurvived}${isEndless ? '' : ' / ' + TARGET_DAYS}`, GAME_WIDTH/2, 280, 24, '#33ff33', 'center');
            
            // Impact Readout
            drawText(`Impact: ${Math.floor(reactor.co2Avoided)} Tons CO2 Prevented`, GAME_WIDTH/2, 320, 24, '#aaddff', 'center');
            drawText(`Impact: ${Math.floor(reactor.livesSaved)} Lives Saved vs. Coal`, GAME_WIDTH/2, 350, 24, '#aaddff', 'center');
            
            drawText(`FACT: ${eduFacts[currentFactIdx].replace("INFO: ", "")}`, GAME_WIDTH/2, 420, 20, '#00ff00', 'center');
            
            drawText(isTouchDevice ? "TAP [JUMP] TO RESTART" : "PRESS [SPACE] TO RESTART", GAME_WIDTH/2, 480, 30, '#ffff00', 'center');
        }

        if (gameState === 'WIN') {
            // Intense flashing red cinematic overlay!
            let flashAlpha = Math.abs(Math.sin(Date.now() / 150)) * 0.4 + 0.3;
            ctx.fillStyle = `rgba(255, 0, 0, ${flashAlpha})`;
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            // Dark backdrop for text readability
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 150, GAME_WIDTH, 350);

            drawText("CRITICAL: 20 YEARS SURVIVED", GAME_WIDTH/2, 170, 50, '#ff3333', 'center');
            drawText("THE CORE IS OVERLOADING!", GAME_WIDTH/2, 230, 30, '#fff', 'center');
            
            // Final Educational Readout
            drawText(`TOTAL CO2 PREVENTED: ${Math.floor(reactor.co2Avoided)} Tons`, GAME_WIDTH/2, 280, 24, '#aaddff', 'center');
            drawText(`TOTAL LIVES SAVED: ${Math.floor(reactor.livesSaved)}`, GAME_WIDTH/2, 310, 24, '#aaddff', 'center');

            drawText(isTouchDevice ? "TAP [JUMP] TO SECURE RETIREMENT (RESTART)" : "PRESS [SPACE] TO SECURE RETIREMENT (RESTART)", GAME_WIDTH/2, 380, 24, '#ffff00', 'center');
            drawText(isTouchDevice ? "TAP [E] TO INITIATE ENDLESS OVERTIME!" : "PRESS [ENTER] TO INITIATE ENDLESS OVERTIME!", GAME_WIDTH/2, 420, 24, '#33ff33', 'center');
        }

        // --- TUTORIAL OVERLAY ---
        if (gameState === 'TUTORIAL') {
            let prompt = "";
            if (tutorialStep === 0) prompt = isTouchDevice ? "Welcome! Use [◀] and [▶] to move, and [JUMP] to jump." : "Welcome! Use [A] and [D] to move, and [W] to jump.";
            else if (tutorialStep === 1) prompt = "Walk right to ROD CONTROL. Hold [E] to withdraw rods and heat the core.";
            else if (tutorialStep === 2) prompt = "Core is heating! Walk to COOLANT PUMPS. Hold [E] to increase cooling.";
            else if (tutorialStep === 3) prompt = "A pipe burst! Walk to the RUPTURE near the core and hold [E] to fix it.";
            else if (tutorialStep === 4) prompt = "Leaks ruin Public Trust. Walk left to the PR DEPT and press [E] for a Townhall.";
            else if (tutorialStep === 5) prompt = isTouchDevice ? "Great! Keep Core Temp OPTIMAL. Tap [JUMP] to start!" : "Great! Keep Core Temp OPTIMAL to earn money. Press [SPACE] to start the real game!";

            drawPixelRect(GAME_WIDTH/2 - 380, 110, 760, 50, 'rgba(0, 30, 0, 0.85)');
            ctx.strokeStyle = '#33ff33'; ctx.lineWidth = 2; ctx.strokeRect(GAME_WIDTH/2 - 380, 110, 760, 50);
            drawText("TUTORIAL: " + prompt, GAME_WIDTH/2, 125, 22, '#ffff00', 'center');
        }
    }

    const TIME_STEP = 1 / 60; // Fixed 60 FPS update rate for smooth physics
    let accumulator = 0;

    function gameLoop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        let frameTime = (timestamp - lastTime) / 1000;
        lastTime = timestamp;
        
        // Prevent "Spiral of Death" if the player tabs out or causes massive lag
        if (frameTime > 0.25) frameTime = 0.25;

        accumulator += frameTime;

        // Fixed timestep loop
        while (accumulator >= TIME_STEP) {
            update(TIME_STEP);
            accumulator -= TIME_STEP;
        }

        draw();

        requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);

</script>
</body>
</html>
