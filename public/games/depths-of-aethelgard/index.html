                this.lights.push({x: this.w/2 * TILE, y: this.h/2 * TILE, r: 400, c: this.biome.light});
            } else {
                let x = Math.floor(this.w/2), y = Math.floor(this.h/2);
                let steps = this.w * this.h * 2.5;
                let floorTiles = [];
                while(steps > 0) {
                    this.grid[y][x] = 0;
                    let dir = Utils.rand(0, 3);
                    if(dir===0 && x<this.w-2) x++; else if(dir===1 && x>1) x--; else if(dir===2 && y<this.h-2) y++; else if(dir===3 && y>1) y--;
                    steps--;
                }
                for(let Y=0; Y<this.h; Y++) for(let X=0; X<this.w; X++) if(this.grid[Y][X]===0) floorTiles.push({x:X,y:Y});
                
                let startIdx = Math.floor(Math.random() * (floorTiles.length / 4)); 
                let startTile = floorTiles[startIdx];
                game.spawn(startTile.x, startTile.y, 'player');

                let exit = floorTiles[floorTiles.length-1];
                this.stairs.x = exit.x*TILE; this.stairs.y = exit.y*TILE;
                // Exit Light
                this.lights.push({x: this.stairs.x + TILE/2, y: this.stairs.y + TILE/2, r: 150, c: '#f1c40f'});

                let count = 4 + Math.floor(floor/2);
                for(let i=0; i<count; i++) {
                    let t = floorTiles[Utils.rand(0, floorTiles.length-1)];
                    if(Utils.dist({x:t.x*TILE, y:t.y*TILE}, game.player) > 300) game.spawn(t.x, t.y, 'enemy', false);
                }
            }
        }

        // Walls & Torch Generation
        for(let y=0; y<this.h; y++) {
            for(let x=0; x<this.w; x++) {
                if(this.grid[y][x]===1) {
                    // Check for wall logic
                    if((x>0 && this.grid[y][x-1]===0) || (x<this.w-1 && this.grid[y][x+1]===0) || (y>0 && this.grid[y-1][x]===0) || (y<this.h-1 && this.grid[y+1][x]===0)) {
                        this.walls.push({x,y});
                        
                        // Random Wall Torch (10% chance if there is a floor below it)
                        if (y < this.h-1 && this.grid[y+1][x] === 0 && Math.random() < 0.1) {
                            this.lights.push({
                                x: x*TILE + TILE/2, 
                                y: y*TILE + TILE, 
                                r: 180, 
                                c: this.biome.torchColor || '#e67e22',
                                flicker: true
                            });
                        }
                    }
                }
            }
        }
    }

    getBiome(f) {
        if (f >= 40) return { // Void
            floor: '#0a0011', floorAlt: '#1a0522',
            wallTop: '#311b92', wallFront: '#220033',
            light: 'rgba(200, 100, 255, 0.2)',
            dust: '#9b59b6', shadow: '#000',
            torchColor: '#9b59b6', type: 'void'
        };
        if (f >= 28) return { // Magma
            floor: '#210b05', floorAlt: '#3e1c10',
            wallTop: '#5d4037', wallFront: '#3e2723',
            light: 'rgba(255, 80, 20, 0.2)',
            dust: '#e74c3c', shadow: '#1a0000',
            torchColor: '#e74c3c', type: 'magma'
        };
        if (f >= 12) return { // Ice
            floor: '#102027', floorAlt: '#1c2d36',
            wallTop: '#455a64', wallFront: '#263238',
            light: 'rgba(100, 220, 255, 0.2)',
            dust: '#b3e5fc', shadow: '#001',
            torchColor: '#00d2d3', type: 'ice'
        };
        // Dungeon
        return { 
            floor: '#111827', floorAlt: '#1f2937',
            wallTop: '#475569', wallFront: '#334155',
            light: 'rgba(255, 200, 120, 0.15)',
            dust: '#aaa', shadow: '#000',
            torchColor: '#e67e22', type: 'dungeon'
        };
    }

    draw(ctx, cx, cy) {
        let sc = Math.floor(cx/TILE), ec = sc + (width/TILE)+2;
        let sr = Math.floor(cy/TILE), er = sr + (height/TILE)+2;
        const b = this.biome;

        for(let y=sr; y<er; y++) {
            for(let x=sc; x<ec; x++) {
                if(y>=0 && y<this.h && x>=0 && x<this.w) {
                    let px = x*TILE - cx;
                    let py = y*TILE - cy;

                    // FLOOR
                    if (this.grid[y][x] === 0) {
                        let decor = this.gridDecor[y][x];
                        ctx.fillStyle = ((x+y)%2===0) ? b.floor : b.floorAlt;
                        ctx.fillRect(px, py, TILE, TILE);
                        
                        // PROPS based on Biome
                        if (decor > 0.7) {
                            ctx.fillStyle = 'rgba(0,0,0,0.3)';
                            if (b.type === 'magma') { // Lava cracks
                                if (decor > 0.9) {
                                    ctx.fillStyle = '#c0392b';
                                    ctx.shadowBlur=5; ctx.shadowColor='#e74c3c';
                                    ctx.beginPath(); ctx.arc(px+TILE/2, py+TILE/2, decor*5, 0, Math.PI*2); ctx.fill();
                                    ctx.shadowBlur=0;
                                } else {
                                    ctx.fillStyle = '#3e1c10';
                                    ctx.fillRect(px + decor*10, py + decor*10, 8, 8);
                                }
                            } else if (b.type === 'ice') { // Ice shards
                                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                                ctx.beginPath(); ctx.moveTo(px+10, py+20); ctx.lineTo(px+20, py+10); ctx.lineTo(px+25, py+25); ctx.fill();
                            } else if (b.type === 'void') { // Runes
                                ctx.fillStyle = '#4a148c';
                                ctx.fillRect(px + decor*20, py + decor*10, 4, 12);
                                ctx.fillRect(px + decor*20 - 4, py + decor*10 + 4, 12, 4);
                            } else { // Dungeon stones
                                ctx.fillStyle = '#222';
                                ctx.beginPath(); ctx.arc(px + decor*30, py + decor*20, 3, 0, Math.PI*2); ctx.fill();
                                if(decor > 0.9) ctx.fillRect(px+5, py+5, 2, 2);
                            }
                        }
                    }
                    // WALL
                    else if (this.grid[y][x] === 1) {
                        // Shadow below wall
                        ctx.fillStyle = 'rgba(0,0,0,0.5)';
                        ctx.fillRect(px, py + TILE, TILE, 12);

                        // Front Face
                        ctx.fillStyle = b.wallFront;
                        ctx.fillRect(px, py + 12, TILE, TILE-12);
                        
                        // Brick Texture
                        ctx.fillStyle = 'rgba(0,0,0,0.2)';
                        if (y%2===0) { ctx.fillRect(px+10, py+12, 2, 10); ctx.fillRect(px+30, py+28, 2, 10); }
                        else { ctx.fillRect(px+20, py+15, 2, 10); }

                        // Top Face (Depth)
                        ctx.fillStyle = b.wallTop;
                        ctx.fillRect(px, py - 12, TILE, 24);
                        
                        // Top Highlight
                        ctx.fillStyle = 'rgba(255,255,255,0.05)';
                        ctx.fillRect(px, py - 12, TILE, 2);
                    }
                }
            }
        }

        // Draw Lights (Additive Blending)
        ctx.globalCompositeOperation = 'lighter';
        for(let l of this.lights) {
            let lx = l.x - cx;
            let ly = l.y - cy;
            // Cull offscreen lights
            if (lx < -l.r || lx > width+l.r || ly < -l.r || ly > height+l.r) continue;

            let flicker = l.flicker ? Math.sin(Date.now()/100 + l.x) * 5 : 0;
            let r = l.r + flicker;
            
            let g = ctx.createRadialGradient(lx, ly, 0, lx, ly, r);
            g.addColorStop(0, l.c);
            g.addColorStop(1, 'rgba(0,0,0,0)');
            
            ctx.fillStyle = g;
            ctx.beginPath(); ctx.arc(lx, ly, r, 0, Math.PI*2); ctx.fill();
        }
        ctx.globalCompositeOperation = 'source-over';

        // Draw Portals
        if (game.mode === 'arena' && game.inHub) {
            for(let p of this.portals) {
                let px = p.x - cx, py = p.y - cy;
                let pulse = Math.sin(Date.now()/300) * 3;
                ctx.fillStyle = 'rgba(52, 152, 219, 0.2)';
                ctx.beginPath(); ctx.arc(px + TILE/2, py + TILE/2, 25 + pulse, 0, Math.PI*2); ctx.fill();
                
                ctx.fillStyle = '#2980b9'; ctx.fillRect(px+5, py+5, TILE-10, TILE-10);
                ctx.fillStyle = '#0f172a'; ctx.fillRect(px+10, py+10, TILE-20, TILE-20);
                ctx.fillStyle = '#3498db'; ctx.fillRect(px+15, py+15, TILE-30, TILE-30);
            }
        }

        let isLocked = game.enemies.length > 0;
        let sx = this.stairs.x - cx, sy = this.stairs.y - cy;
        
        // Don't draw regular stairs in Hub
        if (!(game.mode === 'arena' && game.inHub)) {
            // Draw Stairs with depth
            ctx.fillStyle = '#000'; ctx.fillRect(sx+5, sy+5, TILE-10, TILE-10); 
            for(let i=0; i<4; i++) {
                 ctx.fillStyle = isLocked ? '#522' : '#666';
                 ctx.fillRect(sx+8, sy+8+(i*8), TILE-16, 4);
                 ctx.fillStyle = 'rgba(0,0,0,0.3)';
                 ctx.fillRect(sx+8, sy+12+(i*8), TILE-16, 4);
            }
            if (isLocked) {
                ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 4;
                ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx+TILE, sy+TILE); ctx.moveTo(sx+TILE, sy); ctx.lineTo(sx, sy+TILE); ctx.stroke();
            }
        }
    }
}

/** ---------------- MAIN GAME ---------------- **/
const game = {
    floor: 1, state: 'start', mode: 'normal', inHub: false, player: null, map: null,
    enemies: [], projectiles: [], particles: [], texts: [], pickups: [], effects: [], zones: [], footprints: [],
    cam: {x:0, y:0}, shake: 0,
    bossActive: false, bossHp: 0, bossMaxHp: 100, bossName: "",
    lightOffset: {x:0, y:0}, // For swinging torch light

    spawn: function(gx, gy, type, param) {
        if (type === 'player') {
            this.player.x = gx * TILE;
            this.player.y = gy * TILE;
        } else if (type === 'enemy') {
            this.enemies.push(new Enemy(gx * TILE, gy * TILE, this.floor, param));
        }
    },

    start: function(mode='normal') {
        this.mode = mode;
        this.load();
        document.getElementById('start-menu').classList.add('hidden');
        document.getElementById('death-menu').classList.add('hidden');
        if(('ontouchstart' in window)) document.getElementById('mobile-controls').style.display='flex';
        if(AudioSys.ctx.state === 'suspended') AudioSys.ctx.resume();
        this.state = 'play';
        if(!this.player || this.player.hp <= 0) {
            this.player = new Player();
        }
        if (mode === 'arena') this.loadHub();
        else { this.inHub = false; this.floor = 1; this.newFloor(); }
        this.loop();
    },

    loadHub: function() {
        this.inHub = true;
        this.floor = 0; 
        this.newFloor();
        this.log("ARENA HUB - CHOOSE YOUR FATE");
    },

    loadBoss: function(f) {
        this.inHub = false;
        this.floor = f;
        this.newFloor();
    },

    newFloor: function() {
        this.enemies=[]; this.projectiles=[]; this.pickups=[]; this.particles=[]; this.texts=[]; this.effects=[]; this.zones=[]; this.footprints=[];
        this.map = new MapGen(this.floor);
        this.bossActive = false;
        if (this.mode === 'normal') this.save(); 
        if (this.inHub) {
            document.getElementById('floor-display').innerText = "HUB";
        } else {
            this.log(`Entered Floor ${this.floor}`);
            this.updateUI();
        }
    },

    drop: function(x, y, floor) {
        let id = 0;
        const keys = Object.keys(WEAPONS).map(Number).sort((a,b)=>a-b);
        for(let k of keys) { if(k <= floor) id = k; }
        this.pickups.push({x,y,w:20,h:20,type:'wep',id:id});
    },

    explode: function(x, y, r, dmg) {
        this.createParticles(x, y, '#e74c3c', 20);
        this.enemies.forEach(e => { if(Utils.dist(e, {x,y}) < r) e.hit(dmg); });
        if (Utils.dist(this.player, {x,y}) < r) this.player.hit(dmg);
    },

    createParticles: function(x, y, c, n, type=0) {
        if(this.particles.length > 200) return;
        for(let i=0; i<n; i++) this.particles.push(new Particle(x, y, c, 1, type));
    },

    addText: function(x, y, text, color, size) {
        this.texts.push(new FloatingText(x, y, text, color, size));
    },

    nextFloor: function() {
        if (this.mode === 'arena') {
            if (!this.inHub) {
                this.loadHub();
                AudioSys.sfx.levelup();
            }
        } else {
            this.floor++; AudioSys.sfx.levelup(); this.newFloor();
        }
    },

    log: function(m) {
        const d = document.createElement('div');
        d.className = 'log-entry'; d.innerText = m;
        document.getElementById('msg-log').prepend(d);
        setTimeout(() => { d.style.opacity=0; setTimeout(()=>d.remove(), 500); }, 2000);
    },

    updateUI: function() {
        if(this.inHub) document.getElementById('floor-display').innerText = "HUB";
        else document.getElementById('floor-display').innerText = this.floor;
        document.getElementById('level-display').innerText = this.player.level;

        let hp = this.player.hp || 0;
        let maxHp = this.player.maxHp || 100;
        let xp = this.player.xp || 0;
        let nextLvl = this.player.nextLvl || 100;

        const hpPct = Math.max(0, Math.min(100, (hp / maxHp) * 100));
        document.getElementById('hp-bar').style.width = hpPct + "%";
        
        const xpPct = Math.max(0, Math.min(100, (xp / nextLvl) * 100));
        document.getElementById('xp-fill').style.width = xpPct + "%";

        const w = WEAPONS[this.player.weaponId] || WEAPONS[0];
        document.getElementById('weapon-name').innerText = w.name;
        document.getElementById('weapon-name').style.color = w.color;
        document.getElementById('weapon-desc').innerText = w.desc;

        const bossHud = document.getElementById('boss-hud');
        if (this.bossActive && this.bossHp > 0) {
            bossHud.style.opacity = 1;
            document.getElementById('boss-name-display').innerText = this.bossName;
            const bossPct = Math.max(0, (this.bossHp / this.bossMaxHp) * 100);
            document.getElementById('boss-hp-fill').style.width = bossPct + "%";
        } else {
            bossHud.style.opacity = 0;
        }
    },

    over: function() {
        this.state = 'over';
        localStorage.removeItem('aethelgard_save'); 
        document.getElementById('death-menu').classList.remove('hidden');
        document.getElementById('death-stats').innerText = "Floor: " + this.floor;
    },

    save: function() {
        if (this.player.hp <= 0) return; 
        const d = { f: this.floor, p: { l: this.player.level, xp: this.player.xp, nl: this.player.nextLvl, mh: this.player.maxHp, h: this.player.hp, w: this.player.weaponId }};
        localStorage.setItem('aethelgard_save', JSON.stringify(d));
    },

    load: function() {
        const s = localStorage.getItem('aethelgard_save');
        if(s) {
            try {
                const d = JSON.parse(s);
                if (!d || !d.p || d.p.h <= 0) { 
                    this.resetData(); 
                    return; 
                }
                this.floor = d.f; 
                this.player = new Player();
                this.player.level = d.p.l || 1; 
                this.player.xp = d.p.xp || 0; 
                this.player.nextLvl = d.p.nl || 100;
                this.player.maxHp = d.p.mh || 100; 
                this.player.hp = d.p.h || 100; 
                this.player.weaponId = d.p.w || 0;
            } catch(e) {
                console.error("Save file corrupted, resetting.");
                this.resetData();
            }
        }
    },
    
    resetData: function() { 
        localStorage.removeItem('aethelgard_save'); 
    },

    loop: function() {
        if(game.state !== 'play') return;
        
        // Spawn dust/ambient particles
        if (Math.random() < 0.1) {
            game.createParticles(
                game.cam.x + Math.random()*width, 
                game.cam.y + Math.random()*height, 
                game.map.biome.dust, 
                1, 3
            );
        }
        
        // Weather
        if (game.map.biome.type === 'ice' && Math.random() < 0.3) {
             game.createParticles(game.cam.x + Math.random()*width, game.cam.y + Math.random()*height, '#fff', 1, 4); // Snow
        }
        if (game.map.biome.type === 'magma' && Math.random() < 0.3) {
             game.createParticles(game.cam.x + Math.random()*width, game.cam.y + height + 10, '#fff', 1, 5); // Ash rising
        }
        if (game.map.biome.type === 'void' && Math.random() < 0.2) {
             game.createParticles(game.cam.x + Math.random()*width, game.cam.y + Math.random()*height, '#fff', 1, 6); // Spores
        }

        game.player.update(input, game.map);
        game.enemies.forEach(e => e.update(game.player, game.map));
        game.projectiles.forEach(p => p.update(game.map, game.enemies, game.player));
        game.particles.forEach(p => p.update());
        game.texts.forEach(t => t.update());
        game.zones.forEach(z => z.update());
        
        for(let i=game.effects.length-1; i>=0; i--) {
            let ef = game.effects[i];
            
            if (ef.type === 'beam') {
                ef.life--;
                if(ef.life <= 0) game.effects.splice(i, 1);
                continue;
            }

            if(ef.type === 'orbital') {
                ef.r += 0.2; 
                for(let j=0; j<3; j++) {
                    let ang = ef.r + j * (Math.PI*2/3);
                    let ex = ef.owner.x + ef.owner.w/2 + Math.cos(ang)*60;
                    let ey = ef.owner.y + ef.owner.h/2 + Math.sin(ang)*60;
                    
                    ctx.save();
                    ctx.translate(ex-game.cam.x, ey-game.cam.y);
                    ctx.rotate(ang + Math.PI/2);
                    ctx.shadowBlur = 10; ctx.shadowColor = '#f1c40f';
                    Drawer.weapon(ctx, 'sword_gold', '#f1c40f');
                    ctx.shadowBlur = 0;
                    ctx.restore();

                    game.enemies.forEach(e => {
                        if(Utils.dist({x:ex, y:ey}, e) < 30) {
                             e.hit(ef.damage * 0.1);
                             e.x += Math.cos(ang)*5; e.y += Math.sin(ang)*5;
                        }
                    });
                }
                if(ef.r > 10) game.effects.splice(i, 1);
            }
            else { 
                ef.r += 5;
                if(ef.r >= ef.maxR) game.effects.splice(i, 1);
                else {
                    game.enemies.forEach(e => {
                        if(Utils.dist(e, ef) < ef.r && Utils.dist(e, ef) > ef.r-15) e.hit(ef.damage);
                    });
                }
            }
        }

        game.enemies = game.enemies.filter(e => e.active);
        game.projectiles = game.projectiles.filter(p => p.active);
        game.particles = game.particles.filter(p => p.life > 0 || (p.isBlood && p.life > -1000));
        game.texts = game.texts.filter(t => t.life > 0);
        game.zones = game.zones.filter(z => z.life > 0);
        
        // Update footprints
        for(let i=game.footprints.length-1; i>=0; i--) {
            game.footprints[i].life--;
            if(game.footprints[i].life <= 0) game.footprints.splice(i,1);
        }

        game.updateUI();

        let tx = game.player.x - width/2, ty = game.player.y - height/2;
        game.cam.x += (tx - game.cam.x) * CAM_LERP;
        game.cam.y += (ty - game.cam.y) * CAM_LERP;

        if (game.shake > 0) {
            let sx = (Math.random()-0.5)*game.shake; let sy = (Math.random()-0.5)*game.shake;
            game.shake *= 0.9; if(game.shake < 0.5) game.shake = 0;
            game.cam.x += sx; game.cam.y += sy;
        }

        let cx = game.cam.x, cy = game.cam.y;

        ctx.fillStyle = game.map.biome.floorAlt; ctx.fillRect(0,0,width,height);
        game.map.draw(ctx, cx, cy);
        
        // Render Footprints
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        game.footprints.forEach(fp => {
            let alpha = fp.life / 100;
            ctx.globalAlpha = alpha;
            ctx.beginPath(); ctx.ellipse(fp.x-cx, fp.y-cy, 4, 2, 0, 0, Math.PI*2); ctx.fill();
        });
        ctx.globalAlpha = 1;

        game.zones.forEach(z => z.draw(ctx, cx, cy));
        game.particles.filter(p => p.landed && p.isBlood).forEach(p => p.draw(ctx, cx, cy));

        game.pickups.forEach(p => {
            let bounce = Math.sin(Date.now()/200)*3;
            if(p.type==='wep') {
                let w = WEAPONS[p.id];
                ctx.save(); ctx.translate(p.x-cx+10, p.y-cy+10+bounce); ctx.rotate(-Math.PI/4);
                Drawer.weapon(ctx, w.look, w.color);
                ctx.restore();
            } else {
                ctx.fillStyle = '#e74c3c';
                ctx.beginPath(); ctx.arc(p.x-cx+10, p.y-cy+10+bounce, 6, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#fff'; ctx.fillRect(p.x-cx+8, p.y-cy+6+bounce, 4, 8); ctx.fillRect(p.x-cx+6, p.y-cy+8+bounce, 8, 4);
            }
        });

        game.particles.filter(p => p.landed && (p.isFire || p.isVoid)).forEach(p => p.draw(ctx, cx, cy));

        game.enemies.forEach(e => e.draw(ctx, cx, cy));
        game.player.draw(ctx, cx, cy);
        
        // Use Additive Blending for Glowing Projectiles
        ctx.globalCompositeOperation = 'lighter';
        game.particles.filter(p => !p.landed).forEach(p => p.draw(ctx, cx, cy));
        game.projectiles.forEach(p => p.draw(ctx, cx, cy));
        ctx.globalCompositeOperation = 'source-over';
        
        game.texts.forEach(t => t.draw(ctx, cx, cy));

        game.effects.forEach(ef => {
            if (ef.type === 'beam') {
                ctx.globalCompositeOperation = 'lighter';
                ctx.strokeStyle = ef.color;
                ctx.lineWidth = 15 + Math.sin(Date.now()/50)*5;
                ctx.lineCap = 'round';
                ctx.shadowBlur = 30; ctx.shadowColor = ef.color;
                ctx.beginPath(); ctx.moveTo(ef.x1-cx, ef.y1-cy); ctx.lineTo(ef.x2-cx, ef.y2-cy); ctx.stroke();
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 5; ctx.shadowBlur = 0; ctx.stroke();
                ctx.globalCompositeOperation = 'source-over';
            }
            else if (ef.type === 'spin') {
                 ctx.strokeStyle = ef.color; ctx.lineWidth = 4; 
                 ctx.globalAlpha = 1 - (ef.r / ef.maxR);
                 ctx.beginPath(); ctx.arc(ef.x-cx, ef.y-cy, ef.r, 0, Math.PI*2); ctx.stroke();
                 ctx.fillStyle = ef.color; ctx.globalAlpha = 0.2 * (1 - (ef.r / ef.maxR));
                 ctx.fill(); ctx.globalAlpha = 1;
            }
            else if (ef.type !== 'orbital') { 
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.globalAlpha = 0.6;
                ctx.beginPath(); ctx.arc(ef.x-cx, ef.y-cy, ef.r, 0, Math.PI*2); ctx.stroke(); 
                ctx.globalAlpha = 1;
            }
        });

        const px = game.player.x - cx + game.player.w/2;
        const py = game.player.y - cy + game.player.h/2;
        
        // Swinging lantern effect
        let swingX = Math.cos(Date.now()/500) * 10 - (game.player.moving ? Math.cos(game.player.facing)*20 : 0);
        let swingY = Math.sin(Date.now()/500) * 5 - (game.player.moving ? Math.sin(game.player.facing)*20 : 0);
        game.lightOffset.x += (swingX - game.lightOffset.x) * 0.1;
        game.lightOffset.y += (swingY - game.lightOffset.y) * 0.1;

        let flicker = 150 + Math.sin(Date.now()/100) * 5; 
        const lx = px + game.lightOffset.x;
        const ly = py + game.lightOffset.y;

        const grd = ctx.createRadialGradient(lx, ly, flicker, lx, ly, 750);
        grd.addColorStop(0, 'rgba(0,0,0,0)');
        grd.addColorStop(0.3, game.map.biome.shadow || 'rgba(0,0,0,0.4)');
        grd.addColorStop(1, 'rgba(0,0,0,0.98)');
        ctx.fillStyle = grd;
        ctx.fillRect(0,0,width,height);

        // Player Lantern (Color matches biome)
        const glow = ctx.createRadialGradient(lx, ly, 10, lx, ly, 120);
        glow.addColorStop(0, game.map.biome.light);
        glow.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = glow;
        ctx.fillRect(0,0,width,height);
        ctx.globalCompositeOperation = 'source-over';

        requestAnimationFrame(game.loop);
    }
};

/** ---------------- INPUT ---------------- **/
const input = { keys: {}, joystick: {x:0, y:0}, atk: false, dash: false };
window.onkeydown = e => input.keys[e.key] = true;
window.onkeyup = e => { input.keys[e.key] = false; if(e.key===' ') input.atk=false; };

if(('ontouchstart' in window) || navigator.maxTouchPoints > 0) {
    const j = document.getElementById('joystick-area'), s = document.getElementById('joystick-stick');
    let js = {x:0, y:0};
    j.ontouchstart = e => { e.preventDefault(); js = {x:e.touches[0].clientX, y:e.touches[0].clientY}; s.style.transition='none'; };
    j.ontouchmove = e => {
        e.preventDefault();
        let dx = e.touches[0].clientX - js.x, dy = e.touches[0].clientY - js.y;
        let d = Math.sqrt(dx*dx+dy*dy);
        if(d>35) { dx=(dx/d)*35; dy=(dy/d)*35; }
        s.style.transform=`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
        input.joystick = {x:dx/35, y:dy/35};
    };
    j.ontouchend = e => { e.preventDefault(); input.joystick={x:0,y:0}; s.style.transform='translate(-50%,-50%)'; };
    const b = document.getElementById('attack-btn');
    b.ontouchstart = e => { e.preventDefault(); input.atk = true; };
    b.ontouchend = e => { e.preventDefault(); input.atk = false; };
    const d = document.getElementById('dash-btn');
    d.ontouchstart = e => { e.preventDefault(); input.dash = true; };
    d.ontouchend = e => { e.preventDefault(); input.dash = false; };
} else {
    window.onmousedown = () => input.atk = true;
    window.onmouseup = () => input.atk = false;
}

function resize() { width=window.innerWidth; height=window.innerHeight; canvas.width=width; canvas.height=height; }
window.onresize = resize; resize();
</script>
