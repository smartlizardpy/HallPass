name: Streak reminders

# Asks the live site, once an hour, to send the "your streak ends tonight" push to
# whoever is due one. All the judgement — who is due, at what local hour, what it
# says — lives on the deployment (`app/lib/streak/`) and is tested there; see
# `scripts/send-streak-reminders.mjs`, which is deliberately thin.
#
# WHY HOURLY. A player's reminder hour is 17:00 WHERE THEY ARE, which is a
# different UTC hour for every offset. Each run therefore reaches the players
# whose local time is currently 17:xx, and the site's own once-per-local-day
# claim means an overlapping or repeated run sends nothing twice.
#
# WHY ITS OWN WORKFLOW AND NOT A STEP IN alerts.yml: a streak outage must not turn
# the site-health run red, and a site-health outage must not stop the reminders.
# Different cadence, different failure meaning, different Actions log.
#
# TIMING IS BEST-EFFORT. GitHub queues cron runs and drops them under load, and a
# run can be minutes late. At an hour-wide reminder window a late run is harmless;
# a dropped run costs one hour's worth of players one reminder.

on:
  schedule:
    # Minute 5, not 0: the top of the hour is when GitHub's scheduler is busiest.
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report who is due, but notify nobody"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: streak-reminders
  # NOT cancel-in-progress: a run that has already started claiming reminders
  # should finish sending them.
  cancel-in-progress: false

jobs:
  remind:
    name: Send streak reminders
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Job-level env so the step guard can read whether the secret is set — the
    # `secrets` context is available to job env but not to a step `if`.
    env:
      HAS_ALERTS_SECRET: ${{ secrets.ALERTS_SECRET != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      # No `npm ci`: the runner uses nothing but `node:fs` and `fetch`.

      # OPT-IN, exactly as alerts.yml: until ALERTS_SECRET exists this says what
      # to set and passes, rather than failing red every hour on a repo that has
      # not been provisioned.
      - name: Explain what is missing
        if: env.HAS_ALERTS_SECRET != 'true'
        run: |
          echo "::warning::ALERTS_SECRET is not set, so no streak reminders are being sent."
          {
            echo "### HallPass streak reminders — not configured"
            echo ""
            echo "Add \`ALERTS_SECRET\` under Settings → Secrets and variables → Actions,"
            echo "matching \`ALERTS_SECRET\` on the Vercel deployment. Until then this"
            echo "workflow does nothing."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Send reminders
        if: env.HAS_ALERTS_SECRET == 'true'
        env:
          ALERTS_SECRET: ${{ secrets.ALERTS_SECRET }}
          HALLPASS_SITE_URL: ${{ vars.HALLPASS_SITE_URL }}
        run: |
          node scripts/send-streak-reminders.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
