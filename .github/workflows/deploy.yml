name: Deploy to Vercel (production)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Job-level env so the step guard below can read whether the Blob secret is
    # set — the `secrets` context is available to job env but not to a step `if`.
    env:
      HAS_BLOB_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN != '' }}
      HAS_ALERTS_SECRET: ${{ secrets.ALERTS_SECRET != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Refresh the baked-in game mirror from Vercel Blob so this deploy ships the
      # latest uploads as FREE static files under public/games/, then regenerate
      # the manifest + stamp the serving route reads to pick static-vs-Blob. Runs
      # BEFORE the build so vercel bundles the fresh files.
      #
      # OPT-IN: only runs once BLOB_READ_WRITE_TOKEN is added as a repo secret;
      # without it the deploy just ships the committed mirror (and the route keeps
      # proxying live games from Blob as before). NON-FATAL: a sync hiccup must not
      # block a deploy — the route still proxies any un-mirrored game from Blob, so
      # nothing is lost, it just isn't free that round.
      #
      # DATABASE_URL is how the sync learns which games are STAGED (beta-only) so
      # it never mirrors them into the public static directory, and which
      # published-later games need a directory created. It is a read-only use and
      # OPTIONAL: if the secret is unset or the read fails, the sync falls back to
      # the games.ts flags and creates no new directories.
      #
      # The same DATABASE_URL read drives the COVER MIRROR: a cover an admin chose
      # in the dashboard is written over public/games/<slug>/cover.png for this
      # build, so share cards pick it up. Nothing is committed back to Git; to
      # refresh share cards after changing a cover, run this workflow
      # (workflow_dispatch).
      - name: Sync games from Blob into the static mirror
        if: env.HAS_BLOB_TOKEN == 'true'
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm run sync-games || echo "sync-games failed; deploying with the committed mirror"
          node scripts/build-games-manifest.mjs

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production

      # Verify the production env actually carries the PostHog vars BEFORE we
      # build/deploy. NEXT_PUBLIC_* is inlined at build time, so a missing token
      # here means the deploy would silently capture zero analytics. `vercel
      # pull` above wrote the real production env to .vercel/.env.production.local;
      # --env-file loads it so the script can check presence (never values).
      - name: Check PostHog build env
        run: node --env-file=.vercel/.env.production.local scripts/check-build-env.mjs

      - name: Build
        run: vercel build --prod

      - name: Deploy
        run: |
          url=$(vercel deploy --prebuilt --prod | tail -n1)
          echo "Deployment URL: $url"
          {
            echo "## Deployed to production"
            echo ""
            echo "$url"
          } >> "$GITHUB_STEP_SUMMARY"

      # Tell the site's admins a new version is live: a bell row and, for admins
      # who opted in, a web push, saying what shipped. See
      # `scripts/notify-deploy.mjs` and `docs/deploy-notify-design.md`.
      #
      # NEVER FAILS THE DEPLOY. The site is already live by this point, so a red
      # run over a missing notification would be a false alarm about the thing
      # that worked. The script turns every problem into a warning and exits 0;
      # `continue-on-error` covers whatever a script cannot catch in itself.
      #
      # OPT-IN, like the alerts cron: without ALERTS_SECRET the next step says
      # what to set and the deploy is unaffected.
      #
      # THE COMMIT MESSAGE GOES IN THROUGH `env:` ONLY. It is text somebody typed,
      # and interpolating `${{ ... }}` into a `run:` script would let a crafted
      # commit message run as shell. As an environment variable it is just data.
      # `head_commit.message` exists for pushes; a workflow_dispatch redeploy has
      # no head commit, so the step falls back to the checked-out commit's own.
      #
      # ONE NOTIFICATION PER COMMIT: the site dedupes on the sha, so re-running
      # this workflow or dispatching it again for the same commit announces
      # nothing — including a deliberate redeploy to refresh cover art.
      #
      # TWO MERGES CLOSE TOGETHER: the `concurrency` group above has
      # `cancel-in-progress: true`, so when a second merge lands while the first
      # is still deploying, the first run is cancelled before it reaches this
      # step. Only the NEWER deploy notifies, and it names only its own merge —
      # the cancelled one is never announced, even though it was merged. That
      # is accepted: the newer notification is the version that is actually live.
      - name: Notify admins of the new version
        if: env.HAS_ALERTS_SECRET == 'true'
        continue-on-error: true
        env:
          ALERTS_SECRET: ${{ secrets.ALERTS_SECRET }}
          # Optional; defaults to the production origin in the script.
          HALLPASS_SITE_URL: ${{ vars.HALLPASS_SITE_URL }}
          DEPLOY_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$DEPLOY_COMMIT_MESSAGE" ]; then
            DEPLOY_COMMIT_MESSAGE="$(git log -1 --format=%B)"
            export DEPLOY_COMMIT_MESSAGE
          fi
          node scripts/notify-deploy.mjs

      - name: Explain why admins were not notified
        if: env.HAS_ALERTS_SECRET != 'true'
        run: |
          echo "::warning::ALERTS_SECRET is not set, so admins were not told about this deploy."
          {
            echo "### Deploy notification — not configured"
            echo ""
            echo "Add \`ALERTS_SECRET\` under Settings → Secrets and variables → Actions,"
            echo "matching \`ALERTS_SECRET\` on the Vercel deployment."
          } >> "$GITHUB_STEP_SUMMARY"
